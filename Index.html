<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BayarQue - Billing Internet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        .slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        input[type="month"]::-webkit-calendar-picker-indicator {
            filter: invert(0.6);
            cursor: pointer;
        }

        /* Scrollbar kustom untuk tabel agar lebih cantik di desktop */
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased overflow-hidden">

    <div id="app" class="h-screen w-screen flex flex-col md:flex-row overflow-hidden">
        <div class="flex flex-col items-center justify-center w-full h-full space-y-4">
            <i data-lucide="loader-2" class="animate-spin text-blue-600 w-12 h-12"></i>
            <p class="text-slate-500 font-medium">Memuat Aplikasi BayarQue...</p>
        </div>
    </div>

    <!-- Overlay Loading Global -->
    <div id="loading-overlay" class="fixed inset-0 bg-slate-900/60 z-[60] flex-col items-center justify-center hidden backdrop-blur-sm transition-opacity">
        <i data-lucide="loader-2" class="animate-spin text-white w-12 h-12 mb-3"></i>
        <p id="loading-text" class="text-white font-medium text-lg">Memproses data...</p>
    </div>

    <!-- Container untuk Notifikasi Toast (Pesan Cantik) -->
    <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-3 pointer-events-none *:pointer-events-auto"></div>

    <div id="modal-root"></div>

    <script>
        // =========================================================
        // KONFIGURASI DATABASE PERMANEN
        // =========================================================
        const DATABASE_URL = "https://script.google.com/macros/s/AKfycbyjdyvM5Fu_Nm55WW74zaYF2ckpSQmCGZVAUHwF-5JZNlIZtb7Fybp6Y27cDe12pxIK-w/exec"; 

        // Fungsi Notifikasi Cantik (Toast)
        window.showToast = function(title, message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            
            const toastId = 'toast_' + Math.random().toString(36).substr(2, 9);
            let bgColor = 'bg-emerald-500';
            let icon = 'check-circle';
            
            if (type === 'error') { bgColor = 'bg-red-500'; icon = 'x-circle'; }
            else if (type === 'warning') { bgColor = 'bg-amber-500'; icon = 'alert-triangle'; }
            else if (type === 'info') { bgColor = 'bg-blue-500'; icon = 'info'; }
            
            const toastHTML = `
                <div id="${toastId}" class="flex items-start gap-3 p-4 ${bgColor} text-white rounded-xl shadow-lg transform transition-all duration-300 translate-x-full opacity-0 max-w-sm border border-white/20">
                    <i data-lucide="${icon}" class="w-6 h-6 flex-shrink-0 drop-shadow-sm"></i>
                    <div class="flex-1">
                        <h4 class="font-extrabold text-sm tracking-wide">${title}</h4>
                        <p class="text-xs text-white/90 mt-1 leading-relaxed font-medium">${message}</p>
                    </div>
                    <button onclick="document.getElementById('${toastId}').remove()" class="text-white/70 hover:text-white transition-colors bg-black/10 hover:bg-black/20 p-1 rounded-lg">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
            `;
            
            container.insertAdjacentHTML('beforeend', toastHTML);
            lucide.createIcons();
            
            const toastEl = document.getElementById(toastId);
            requestAnimationFrame(() => {
                toastEl.classList.remove('translate-x-full', 'opacity-0');
                toastEl.classList.add('translate-x-0', 'opacity-100');
            });
            
            setTimeout(() => {
                if(document.getElementById(toastId)) {
                    toastEl.classList.remove('translate-x-0', 'opacity-100');
                    toastEl.classList.add('translate-x-full', 'opacity-0');
                    setTimeout(() => { toastEl.remove(); }, 300); 
                }
            }, 3500);
        }

        let state = {
            packages: [],
            technicians: [],
            customers: [],
            payments: [],
            admin: { user: 'admin', pass: 'admin123' }
        };

        let currentUser = null; 
        let userRole = null; 
        let currentMenu = 'dashboard';
        let isMobileMenuOpen = false;
        let isDesktopSidebarOpen = true;

        window.selectedMonth = new Date().toISOString().slice(0, 7); 
        window.reportFilterDue = 'all';

        // =========================================================
        // KONEKSI GOOGLE SHEETS (APPS SCRIPT)
        // =========================================================

        async function syncToDatabase(loadingMessage = "Menyimpan ke Google Sheets...") {
            const url = DATABASE_URL || localStorage.getItem('bayarque_script_url');
            if (!url) return;
            
            showLoading(loadingMessage);
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    redirect: 'follow',
                    body: JSON.stringify(state)
                });
                
                try {
                    const result = await response.json();
                    if(result.status !== 'success' && result.error) console.warn("Peringatan server:", result.error);
                } catch(e) {
                    console.log("Response transport network aman.");
                }
            } catch (error) {
                console.error("Gagal sinkron:", error);
                const modalRoot = document.getElementById('modal-root');
                modalRoot.innerHTML = `
                    <div class="fixed inset-0 bg-slate-900/60 z-[70] flex justify-center items-center p-4">
                        <div class="bg-white rounded-xl p-6 max-w-sm w-full text-center fade-in">
                            <i data-lucide="alert-triangle" class="w-12 h-12 text-red-500 mx-auto mb-3"></i>
                            <h3 class="font-bold text-lg text-slate-800">Gagal Menyimpan</h3>
                            <p class="text-sm text-slate-500 mt-2">Tidak dapat terhubung ke Google Sheets. Periksa URL Web App di menu Pengaturan atau koneksi internet Anda.</p>
                            <button onclick="closeModal()" class="mt-5 bg-red-500 hover:bg-red-600 text-white px-6 py-2.5 rounded-lg font-bold transition-colors">Tutup</button>
                        </div>
                    </div>
                `;
                lucide.createIcons();
            }
            hideLoading();
        }

        async function loadFromGoogleSheets(url) {
            showLoading("Mengunduh data dari Google Sheets...");
            try {
                const cacheBuster = new Date().getTime();
                const fetchUrl = url + (url.includes('?') ? '&' : '?') + 'nocache=' + cacheBuster;
                
                const response = await fetch(fetchUrl);
                const data = await response.json();
                
                if(data.packages) state.packages = data.packages;
                if(data.technicians) state.technicians = data.technicians;
                
                if(data.customers) {
                    state.customers = data.customers.map(c => ({
                        ...c,
                        id: String(c.id).trim(),
                        packageId: String(c.packageId).trim()
                    }));
                }
                
                if(data.payments) {
                    state.payments = data.payments.map(p => {
                        let parsedMonth = String(p.month).trim();
                        if (parsedMonth.includes('T')) {
                            const d = new Date(parsedMonth);
                            if (!isNaN(d.getTime())) {
                                parsedMonth = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0');
                            }
                        }
                        return {
                            ...p,
                            customerId: String(p.customerId).trim(),
                            month: parsedMonth,
                            status: String(p.status).trim()
                        };
                    });
                }
                
                if(data.admin && data.admin.user) state.admin = data.admin;
                
                checkSessionAndRender();
            } catch (error) {
                console.error("Gagal mengambil data:", error);
                checkSessionAndRender(true);
                setTimeout(() => {
                    showToast("Koneksi Gagal", "Pastikan URL Apps Script benar dan status aksesnya 'Anyone'.", "error");
                }, 500);
            }
            hideLoading();
        }

        window.onload = async function() {
            const url = DATABASE_URL || localStorage.getItem('bayarque_script_url');
            if (url) {
                await loadFromGoogleSheets(url);
            } else {
                checkSessionAndRender(true);
                setTimeout(() => {
                    showToast("Belum Terhubung", "Buka menu Pengaturan dan masukkan URL Apps Script Anda.", "warning");
                }, 1000);
            }
        };

        function checkSessionAndRender(isOffline = false) {
            const savedSession = localStorage.getItem('bayarque_session');
            if (savedSession && !currentUser) {
                const sessionData = JSON.parse(savedSession);
                currentUser = sessionData.user;
                userRole = sessionData.role;
            }
            renderApp();
            
            if (isOffline && currentUser) {
                const main = document.getElementById('main-content');
                if(main) {
                    main.insertAdjacentHTML('afterbegin', `
                        <div class="bg-amber-50 border border-amber-200 text-amber-800 p-4 rounded-xl mb-6 flex items-start gap-3 fade-in shadow-sm">
                            <i data-lucide="alert-triangle" class="w-6 h-6 text-amber-600 flex-shrink-0"></i>
                            <div>
                                <p class="font-bold">Mode Lokal Terdeteksi</p>
                                <p class="text-sm">URL Google Sheets belum diatur atau koneksi terputus. Data saat ini belum tersinkronisasi.</p>
                            </div>
                        </div>
                    `);
                    lucide.createIcons();
                }
            }
        }

        function showLoading(text) {
            document.getElementById('loading-text').innerText = text;
            const overlay = document.getElementById('loading-overlay');
            overlay.classList.remove('hidden'); overlay.classList.add('flex');
        }

        function hideLoading() {
            const overlay = document.getElementById('loading-overlay');
            overlay.classList.add('hidden'); overlay.classList.remove('flex');
        }

        function generateId() { return 'id_' + Math.random().toString(36).substr(2, 9); }
        function formatRp(angka) { return "Rp " + Number(angka).toLocaleString('id-ID'); }
        function formatMonthName(yyyyMm) {
            if(!yyyyMm) return '';
            const [y, m] = yyyyMm.split('-');
            const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            return `${months[parseInt(m)-1]} ${y}`;
        }

        window.changeGlobalMonth = function(val) {
            if(!val) return;
            window.selectedMonth = val;
            renderApp(); 
        };

        window.updateGlobalMonth = function() {
            let m = document.getElementById('sel-month').value;
            let y = document.getElementById('sel-year').value;
            window.changeGlobalMonth(y + '-' + m);
        };

        // Format Ribuan Otomatis
        window.formatRibuan = function(angka) {
            return Number(angka).toLocaleString('id-ID');
        }

        window.formatInputRibuan = function(input) {
            let val = String(input.value).replace(/\D/g, ''); 
            if(val) input.value = Number(val).toLocaleString('id-ID');
            else input.value = '';
        }

        // Fungsi Sinkronisasi Paksa
        window.forceSync = async function() {
            const url = DATABASE_URL || localStorage.getItem('bayarque_script_url');
            if(!url) return showToast("Gagal", "URL Database belum diatur", "error");
            await loadFromGoogleSheets(url);
            showToast("Sinkronisasi Selesai", "Data terbaru berhasil ditarik dari database.", "success");
        }

        function renderApp() {
            const app = document.getElementById('app');
            if (!currentUser) {
                app.innerHTML = getLoginHTML();
            } else {
                app.innerHTML = getLayoutHTML();
                renderMenuContent();
            }
            lucide.createIcons();
        }

        window.switchLoginTab = function(type) {
            document.getElementById('login-type').value = type;
            const btnAdmin = document.getElementById('btn-tab-admin');
            const btnTech = document.getElementById('btn-tab-tech');
            const loginTitle = document.getElementById('login-title');

            if(type === 'admin') {
                btnAdmin.className = "flex-1 py-3 text-sm font-bold text-slate-800 bg-white shadow-sm rounded-lg transition-all";
                btnTech.className = "flex-1 py-3 text-sm font-medium text-white hover:bg-white/10 rounded-lg transition-all";
                loginTitle.innerText = "Login Administrator";
            } else {
                btnTech.className = "flex-1 py-3 text-sm font-bold text-slate-800 bg-white shadow-sm rounded-lg transition-all";
                btnAdmin.className = "flex-1 py-3 text-sm font-medium text-white hover:bg-white/10 rounded-lg transition-all";
                loginTitle.innerText = "Login Teknisi";
            }
        };

        function getLoginHTML() {
            return `
                <div class="min-h-screen w-full bg-slate-900 flex items-center justify-center p-4 relative overflow-hidden">
                    <div class="absolute inset-0 z-0 opacity-20">
                        <div class="absolute w-[500px] h-[500px] bg-blue-600 rounded-full blur-[100px] -top-20 -left-20"></div>
                        <div class="absolute w-[400px] h-[400px] bg-orange-600 rounded-full blur-[100px] -bottom-20 -right-20"></div>
                        <svg class="absolute inset-0 w-full h-full" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
                                    <circle cx="2" cy="2" r="1.5" fill="rgba(255,255,255,0.2)"></circle>
                                    <path d="M2 2 L40 40 M40 2 L2 40" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
                                </pattern>
                            </defs>
                            <rect width="100%" height="100%" fill="url(#dots)"></rect>
                        </svg>
                    </div>

                    <div class="w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl shadow-2xl z-10 overflow-hidden fade-in">
                        <div class="p-8 text-center relative overflow-hidden border-b border-white/10">
                            <!-- Logo Vektor 'B' -->
                            <div class="mx-auto w-20 h-20 bg-gradient-to-br from-blue-500 to-orange-500 rounded-2xl flex items-center justify-center shadow-lg mb-4 relative overflow-hidden group">
                                <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-white relative z-10">
                                    <path d="M4 4V20H13.5C16.5376 20 19 17.5376 19 14.5C19 12.3023 17.7126 10.4063 15.8458 9.51886C17.1517 8.52097 18 6.86178 18 5C18 3.89543 17.1046 3 16 3H4ZM6 6H13.5C14.8807 6 16 7.11929 16 8.5C16 9.88071 14.8807 11 13.5 11H6V6ZM6 13H13.5C15.433 13 17 14.567 17 16.5C17 18.433 15.433 20 13.5 20H6V13Z" fill="currentColor"/>
                                    <circle cx="16" cy="19" r="2" fill="white" class="animate-pulse"/>
                                    <circle cx="20" cy="5" r="1.5" fill="white" opacity="0.8"/>
                                    <path d="M16 19 L20 5" stroke="white" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.5"/>
                                </svg>
                            </div>
                            
                            <h1 class="text-4xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-orange-400 drop-shadow-sm">BayarQue</h1>
                            <p class="text-blue-100 mt-2 text-sm font-medium tracking-wide opacity-80">Portal Billing Internet Pintar</p>
                        </div>
                        
                        <div class="p-8">
                            <div class="flex p-1.5 bg-white/10 rounded-xl mb-6 backdrop-blur-md border border-white/5">
                                <button type="button" id="btn-tab-admin" onclick="switchLoginTab('admin')" class="flex-1 py-3 text-sm font-bold text-slate-800 bg-white shadow-sm rounded-lg transition-all">Admin</button>
                                <button type="button" id="btn-tab-tech" onclick="switchLoginTab('teknisi')" class="flex-1 py-3 text-sm font-medium text-white hover:bg-white/10 rounded-lg transition-all">Teknisi</button>
                            </div>

                            <form onsubmit="handleLogin(event)" class="space-y-5">
                                <input type="hidden" id="login-type" value="admin">
                                <div id="login-error" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm font-bold border border-red-200 text-center"></div>
                                
                                <div>
                                    <label class="block text-sm font-bold text-white mb-1.5">Password Login</label>
                                    <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                            <i data-lucide="lock" class="w-5 h-5"></i>
                                        </div>
                                        <input type="password" id="login-pass" required placeholder="Masukkan kata sandi..." class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 focus:bg-white font-medium transition-colors text-slate-800">
                                    </div>
                                </div>
                                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition-colors shadow-md mt-2 flex items-center justify-center gap-2">
                                    <span id="login-title">Login Administrator</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            `;
        }

        window.handleLogin = function(event) {
            event.preventDefault();
            const type = document.getElementById('login-type').value;
            const p = document.getElementById('login-pass').value.trim();
            const errorDiv = document.getElementById('login-error');

            if (type === 'admin') {
                if (String(p) === String(state.admin.pass)) {
                    currentUser = { id: 'admin', name: 'Administrator' };
                    userRole = 'admin';
                } else {
                    showLoginError("Password admin salah!");
                    return;
                }
            } else {
                const tech = state.technicians.find(t => String(t.pass || '') === p);
                if (tech) {
                    currentUser = tech;
                    userRole = 'teknisi';
                } else {
                    showLoginError("Password teknisi salah!");
                    return;
                }
            }

            localStorage.setItem('bayarque_session', JSON.stringify({ user: currentUser, role: userRole }));
            currentMenu = 'dashboard';
            renderApp();
        }

        function showLoginError(msg) {
            const errorDiv = document.getElementById('login-error');
            errorDiv.innerHTML = `<i data-lucide="alert-circle" class="w-4 h-4 inline mb-0.5"></i> ${msg}`;
            errorDiv.classList.remove('hidden');
            lucide.createIcons();
        }

        window.handleLogout = function() {
            currentUser = null; userRole = null;
            localStorage.removeItem('bayarque_session');
            renderApp();
        }

        window.setMenu = function(menu) {
            currentMenu = menu;
            isMobileMenuOpen = false;
            window.searchCustomer = "";
            window.searchPayment15 = "";
            window.searchPayment25 = "";
            window.filterPay15 = "belum";
            window.filterPay25 = "belum";
            window.reportFilterDue = 'all'; // Reset filter laporan
            renderApp();
        }

        window.toggleMobileMenu = function() {
            if (window.innerWidth >= 768) {
                isDesktopSidebarOpen = !isDesktopSidebarOpen;
            } else {
                isMobileMenuOpen = !isMobileMenuOpen;
            }
            renderApp();
        }

        function getLayoutHTML() {
            const menus = [
                { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                { id: 'pelanggan', label: 'Pelanggan', icon: 'users' },
                { id: 'paket', label: 'Paket', icon: 'package' },
                { id: 'teknisi', label: 'Manajemen Teknisi', icon: 'wrench', role: 'admin' },
                { id: 'pay15', label: 'Tagihan Tgl 15', icon: 'credit-card' },
                { id: 'pay25', label: 'Tagihan Tgl 25', icon: 'credit-card' },
                { id: 'laporan', label: 'Laporan Keuangan', icon: 'file-text' },
                { id: 'pengaturan', label: 'Pengaturan', icon: 'settings', role: 'admin' },
            ];

            let sidebarHTML = menus.map(m => {
                if (m.role && m.role !== userRole) return ''; 
                const isActive = currentMenu === m.id;
                return `
                    <button onclick="setMenu('${m.id}')" class="w-full flex items-center gap-3 px-4 py-3 rounded-md transition-colors ${isActive ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}">
                        <i data-lucide="${m.icon}" class="w-5 h-5"></i>
                        <span class="font-medium text-sm md:text-base">${m.label}</span>
                    </button>
                `;
            }).join('');

            return `
                <div class="${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} ${isDesktopSidebarOpen ? 'md:translate-x-0 md:relative md:flex' : 'md:-translate-x-full md:hidden'} fixed z-40 inset-y-0 left-0 w-64 bg-slate-900 text-white transition-transform duration-300 ease-in-out flex flex-col shadow-2xl md:shadow-none">
                    <div class="p-5 flex items-center justify-between border-b border-slate-800">
                        <h1 class="text-2xl font-extrabold tracking-tight flex items-center gap-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-orange-400">
                            <i data-lucide="wifi" class="w-6 h-6 text-orange-400"></i> BayarQue
                        </h1>
                        <button onclick="toggleMobileMenu()" class="md:hidden text-slate-400 hover:text-white bg-slate-800 p-1.5 rounded-lg"><i data-lucide="x"></i></button>
                    </div>
                    <div class="px-5 py-4 text-xs font-semibold text-slate-400 border-b border-slate-800 bg-slate-900/50 flex flex-col gap-1.5">
                        <span class="uppercase tracking-wider">Login Sebagai:</span>
                        <span class="text-white text-sm font-bold flex items-center gap-2">
                            <i data-lucide="user-check" class="w-4 h-4 text-emerald-400"></i> ${currentUser.name}
                        </span>
                        <span class="text-[10px] text-blue-400 bg-blue-400/10 px-2 py-0.5 rounded w-max mt-0.5 border border-blue-400/20">${userRole.toUpperCase()}</span>
                    </div>

                    <div class="px-5 py-4 border-b border-slate-800 bg-slate-800/30">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Bulan & Tahun Penagihan:</label>
                        <div class="flex gap-2">
                            <select id="sel-month" onchange="updateGlobalMonth()" class="w-full bg-slate-950/50 border border-slate-700/50 text-white text-sm rounded-lg px-2 py-2 outline-none cursor-pointer">
                                <option value="01" ${window.selectedMonth.endsWith('-01')?'selected':''}>Januari</option>
                                <option value="02" ${window.selectedMonth.endsWith('-02')?'selected':''}>Februari</option>
                                <option value="03" ${window.selectedMonth.endsWith('-03')?'selected':''}>Maret</option>
                                <option value="04" ${window.selectedMonth.endsWith('-04')?'selected':''}>April</option>
                                <option value="05" ${window.selectedMonth.endsWith('-05')?'selected':''}>Mei</option>
                                <option value="06" ${window.selectedMonth.endsWith('-06')?'selected':''}>Juni</option>
                                <option value="07" ${window.selectedMonth.endsWith('-07')?'selected':''}>Juli</option>
                                <option value="08" ${window.selectedMonth.endsWith('-08')?'selected':''}>Agustus</option>
                                <option value="09" ${window.selectedMonth.endsWith('-09')?'selected':''}>September</option>
                                <option value="10" ${window.selectedMonth.endsWith('-10')?'selected':''}>Oktober</option>
                                <option value="11" ${window.selectedMonth.endsWith('-11')?'selected':''}>November</option>

        function getViewDashboard() {
            const monthKey = window.selectedMonth;

            let myCustomers = state.customers;
            let myPayments = state.payments;
            
            const activeCust = myCustomers.filter(c => c.status === 'Aktif');
            const totalActive = activeCust.length;
            
            let lunasCount = 0;
            let belumCount = 0;
            
            activeCust.forEach(c => {
                const pay = myPayments.find(p => p.customerId === c.id && p.month === monthKey);
                if (pay && pay.status === 'Lunas') lunasCount++;
                else belumCount++;
            });

            const revBulanIni = myPayments.filter(p => p.status === 'Lunas' && p.month === monthKey)
                                          .reduce((sum, p) => sum + Number(p.amount), 0);
            
            let potensiBulanIni = 0;
            activeCust.forEach(c => {
                const pkg = state.packages.find(pk => pk.id === c.packageId);
                let tagihan = pkg ? Number(pkg.price) : 0;
                if (c.customPrice && Number(c.customPrice) > 0) tagihan = Number(c.customPrice);
                potensiBulanIni += tagihan;
            });

            return `

                    <div>
                        <h2 class="text-2xl font-bold text-slate-800">Dashboard Utama</h2>
                        <p class="text-sm text-slate-500 mt-1">Laporan Ringkasan Bulan: <span class="font-bold text-blue-600">${formatMonthName(monthKey)}</span></p>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                        <div class="bg-blue-600 p-5 rounded-2xl shadow-sm flex flex-col justify-center text-white">
                            <div class="flex items-center gap-3 mb-2">
                                <div class="p-2.5 rounded-lg bg-blue-500 text-white"><i data-lucide="users" class="w-5 h-5"></i></div>
                                <p class="text-sm font-medium text-blue-100">Semua Pelanggan Aktif</p>
                            </div>
                            <p class="text-3xl font-extrabold pl-1">${totalActive} <span class="text-xs font-semibold text-blue-200">Orang</span></p>
                        </div>
                        
                        <div onclick="openModalDashboardDetail('lunas')" class="bg-emerald-500 cursor-pointer hover:bg-emerald-600 p-5 rounded-2xl shadow-sm flex flex-col justify-center relative overflow-hidden transition-colors group text-white">
                            <div class="absolute -right-4 -top-4 opacity-10 group-hover:scale-110 transition-transform"><i data-lucide="check-circle" class="w-24 h-24 text-white"></i></div>
                            <div class="flex items-center justify-between mb-2 relative z-10">
                                <div class="flex items-center gap-3">
                                    <div class="p-2.5 rounded-lg bg-emerald-400 shadow-sm"><i data-lucide="check-circle" class="w-5 h-5"></i></div>
                                    <p class="text-sm font-bold text-emerald-50">Sudah Bayar</p>
                                </div>
                                <span class="text-[10px] font-bold bg-white text-emerald-600 px-2 py-1 rounded shadow-sm">Lihat ➔</span>
                            </div>
                            <p class="text-3xl font-extrabold pl-1 relative z-10">${lunasCount} <span class="text-xs font-semibold text-emerald-100">Lunas Bln Ini</span></p>
                        </div>
                        
                        <div onclick="openModalDashboardDetail('nunggak')" class="bg-red-500 cursor-pointer hover:bg-red-600 p-5 rounded-2xl shadow-sm flex flex-col justify-center relative overflow-hidden transition-colors group text-white">
                            <div class="absolute -right-4 -top-4 opacity-10 group-hover:scale-110 transition-transform"><i data-lucide="alert-circle" class="w-24 h-24 text-white"></i></div>
                            <div class="flex items-center justify-between mb-2 relative z-10">
                                <div class="flex items-center gap-3">
                                    <div class="p-2.5 rounded-lg bg-red-400 shadow-sm"><i data-lucide="alert-circle" class="w-5 h-5"></i></div>
                                    <p class="text-sm font-bold text-red-50">Belum Lunas</p>
                                </div>
                                <span class="text-[10px] font-bold bg-white text-red-600 px-2 py-1 rounded shadow-sm">Lihat ➔</span>
                            </div>
                            <p class="text-3xl font-extrabold pl-1 relative z-10">${belumCount} <span class="text-xs font-semibold text-red-100">Nunggak Bln Ini</span></p>
                        </div>
                        
                        <div class="bg-purple-600 p-5 rounded-2xl shadow-sm flex flex-col justify-center text-white relative overflow-hidden">
                            <div class="absolute -right-4 -bottom-4 opacity-10"><i data-lucide="banknote" class="w-24 h-24 text-white"></i></div>
                            <div class="flex items-center gap-3 mb-2 relative z-10">
                                <div class="p-2.5 rounded-lg bg-purple-500 text-white"><i data-lucide="wallet" class="w-5 h-5"></i></div>
                                <p class="text-sm font-bold text-purple-100">Total Uang Masuk</p>
                            </div>
                            <p class="text-2xl font-extrabold pl-1 truncate relative z-10">${formatRp(revBulanIni)}</p>
                            <p class="text-[11px] text-purple-100 font-bold pl-1 mt-1 bg-purple-500/50 w-max px-2 py-0.5 rounded relative z-10">Target: ${formatRp(potensiBulanIni)}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        window.openModalDashboardDetail = function(type, filterDue = 'all') {
            const monthKey = window.selectedMonth;
            let myCustomers = state.customers.filter(c => c.status === 'Aktif');
            let myPayments = state.payments;

            let title = type === 'lunas' ? 'Data Pelanggan (Sudah Lunas)' : 'Data Pelanggan (Belum Bayar)';
            let bgColor = type === 'lunas' ? 'bg-emerald-50 border-emerald-100' : 'bg-red-50 border-red-100';
            let textColor = type === 'lunas' ? 'text-emerald-800' : 'text-red-800';
            let icon = type === 'lunas' ? 'check-circle' : 'alert-circle';

            let baseFiltered = myCustomers.filter(c => {
                const pay = myPayments.find(p => p.customerId === c.id && p.month === monthKey);
                if (type === 'lunas') return pay && pay.status === 'Lunas';
                return !pay || pay.status !== 'Lunas';
            });

            let count15 = baseFiltered.filter(c => String(c.dueDate) === '15').length;
            let count25 = baseFiltered.filter(c => String(c.dueDate) === '25').length;

            let filtered = baseFiltered;
            if (filterDue !== 'all') {
                filtered = baseFiltered.filter(c => String(c.dueDate) === String(filterDue));
            }

            filtered.sort((a, b) => Number(a.dueDate) - Number(b.dueDate));

            let listHTML = filtered.map((c, i) => {
                const pkg = state.packages.find(pk => pk.id === c.packageId);
                let tagihan = pkg ? Number(pkg.price) : 0;
                if (c.customPrice && Number(c.customPrice) > 0) tagihan = Number(c.customPrice);

                return `
                    <div class="flex justify-between items-center py-3 border-b border-slate-100 last:border-0 hover:bg-white p-2 rounded-lg transition-colors">
                        <div>
                            <p class="font-bold text-sm text-slate-800">${i+1}. ${c.name}</p>
                            <p class="text-xs text-slate-500 flex items-center gap-1 mt-0.5"><i data-lucide="phone" class="w-3 h-3"></i> ${c.phone}</p>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-sm text-slate-800">${formatRp(tagihan)}</p>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600">Jatuh Tempo: Tgl ${c.dueDate}</span>
                        </div>
                    </div>
                `;
            }).join('');

            if(listHTML === '') listHTML = `<div class="p-6 text-center text-slate-500 font-medium">Tidak ada data di kategori ini.</div>`;

            const html = `
                <div class="fixed inset-0 bg-slate-900/60 z-50 flex justify-center items-center p-4 backdrop-blur-sm">
                    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden fade-in flex flex-col max-h-[85vh]">
                        <div class="p-5 border-b flex justify-between items-center ${bgColor}">
                            <h3 class="text-lg font-bold ${textColor} flex items-center gap-2"><i data-lucide="${icon}" class="w-5 h-5"></i> ${title}</h3>
                            <button onclick="closeModal()" class="text-slate-500 hover:text-slate-800 bg-white p-1.5 rounded-full shadow-sm"><i data-lucide="x" class="w-4 h-4"></i></button>
                        </div>
                        <div class="p-3 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                            <div class="flex gap-2">
                                <span class="text-[10px] font-bold bg-blue-100 text-blue-700 px-2 py-1 rounded shadow-sm">Tgl 15: ${count15} Org</span>
                                <span class="text-[10px] font-bold bg-amber-100 text-amber-700 px-2 py-1 rounded shadow-sm">Tgl 25: ${count25} Org</span>
                            </div>
                            <select onchange="openModalDashboardDetail('${type}', this.value)" class="text-xs border border-slate-200 rounded-lg p-1.5 outline-none font-bold text-slate-700 bg-white cursor-pointer shadow-sm">
                                <option value="all" ${filterDue === 'all' ? 'selected' : ''}>Semua Tanggal</option>
                                <option value="15" ${filterDue === '15' ? 'selected' : ''}>Hanya Tgl 15</option>
                                <option value="25" ${filterDue === '25' ? 'selected' : ''}>Hanya Tgl 25</option>
                            </select>
                        </div>
                        <div class="overflow-y-auto p-4 bg-slate-50/50 custom-scrollbar">
                            ${listHTML}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-root').innerHTML = html;
            lucide.createIcons();
        };

        // ANTI KEDIP PENCARIAN PELANGGAN DI HP
        window.filterCustomerPay = '';
        window.changeCustomerFilter = function() {
            window.filterCustomerPay = document.getElementById('cust-pay-filter').value;
            const tbody = document.getElementById('cust-tbody');
            if (tbody) { tbody.innerHTML = getCustomerRowsHTML(); lucide.createIcons(); }
            else renderMenuContent();
        };

        window.handleSearchCustomer = function(val) {
            window.searchCustomer = val;
            const tbody = document.getElementById('cust-tbody');
            if (tbody) { tbody.innerHTML = getCustomerRowsHTML(); lucide.createIcons(); }
        }

        // FUNGSI PEMBUAT BARIS TABEL PELANGGAN
        function getCustomerRowsHTML() {
            const monthKey = window.selectedMonth;

            const d = new Date(monthKey + "-01");
            const m0 = d.toISOString().slice(0, 7); 
            d.setMonth(d.getMonth() - 1); const m1 = d.toISOString().slice(0, 7); 
            d.setMonth(d.getMonth() - 1); const m2 = d.toISOString().slice(0, 7); 
            const last3Months = [m0, m1, m2];

            let filteredCust = state.customers;

            if (window.searchCustomer) {
                const q = String(window.searchCustomer).toLowerCase();
                filteredCust = filteredCust.filter(c => 
                    String(c.name).toLowerCase().includes(q) || 
                    String(c.phone).toLowerCase().includes(q) ||
                    String(c.address || '').toLowerCase().includes(q)
                );
            }
            
            if (window.filterCustomerPay === 'lunas') {
                filteredCust = filteredCust.filter(c => {
                    const pay = state.payments.find(p => p.customerId === c.id && p.month === monthKey);
                    return pay && pay.status === 'Lunas';
                });
            } else if (window.filterCustomerPay === 'belum') {
                filteredCust = filteredCust.filter(c => {
                    const pay = state.payments.find(p => p.customerId === c.id && p.month === monthKey);
                    return !pay || pay.status !== 'Lunas';
                });
            } else if (window.filterCustomerPay === 'nunggak') {
                filteredCust = filteredCust.filter(c => {
                    let nunggakCount = 0;
                    last3Months.forEach(m => {
                        const pay = state.payments.find(p => p.customerId === c.id && p.month === m);
                        if (!pay || pay.status !== 'Lunas') nunggakCount++;
                    });
                    return nunggakCount >= 1 && nunggakCount <= 3;
                });
            }

            let trs = filteredCust.map(c => {
                const pkg = state.packages.find(p => p.id === c.packageId);
                const pkgDisplay = pkg ? pkg.name : '-';
                
                let tagihan = pkg ? pkg.price : 0;
                if (c.customPrice && Number(c.customPrice) > 0) tagihan = Number(c.customPrice);
                
                const pay = state.payments.find(p => p.customerId === c.id && p.month === monthKey);
                
                let payBadge = `<span class="px-2.5 py-1 bg-slate-100 text-slate-600 rounded-full text-xs font-bold">Belum Ditagih</span>`;
                let payNote = `<div class="text-[11px] text-slate-400 mt-1.5 font-bold">Jatuh Tempo: Tgl ${c.dueDate}</div>`;
                
                let countTunggakan = 0;
                last3Months.forEach(m => {
                    const pastPay = state.payments.find(p => p.customerId === c.id && p.month === m);
                    if (!pastPay || pastPay.status !== 'Lunas') countTunggakan++;
                });

                if(pay) {
                    if(pay.status === 'Lunas') {
                        payBadge = `<span class="px-2.5 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full text-xs font-bold"><i data-lucide="check" class="w-3 h-3 inline"></i> Lunas</span>`;
                        payNote = `<div class="text-[11px] text-emerald-600 mt-1.5 font-bold">Via ${pay.method} (${pay.date})</div>`;
                    } else {
                        payBadge = `<span class="px-2.5 py-1 bg-red-50 text-red-700 border border-red-200 rounded-full text-xs font-bold"><i data-lucide="x" class="w-3 h-3 inline"></i> Belum Bayar</span>`;
                        payNote = `<div class="text-[11px] text-red-500 mt-1.5 font-bold truncate max-w-[150px]" title="${pay.reason}">Ket: ${pay.reason || '-'}</div>`;
                    }
                }

                // FITUR IZIN TEKNISI MENGUBAH HARGA
                let canEditPrice = false;
                if (userRole === 'admin') canEditPrice = true;
                else if (userRole === 'teknisi' && currentUser.allowEditPrice) canEditPrice = true;

                let editPriceBtn = canEditPrice 
                    ? `<button onclick="openModalCustomPrice('${c.id}')" class="text-amber-600 bg-amber-50 hover:bg-amber-100 p-2.5 rounded-lg transition-colors border border-amber-200 flex items-center justify-center shadow-sm" title="Ubah Nominal Khusus">
                            <i data-lucide="dollar-sign" class="w-4 h-4"></i>
                       </button>`
                    : `<button onclick="showToast('Akses Ditolak', 'Anda tidak diizinkan mengubah Nominal Khusus. Hubungi Admin.', 'error')" class="text-slate-400 bg-slate-100 p-2.5 rounded-lg border border-slate-200 flex items-center justify-center shadow-sm cursor-not-allowed" title="Terkunci">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                       </button>`;

                return `
                    <tr class="hover:bg-slate-50/80 border-b border-slate-100 last:border-0 transition-colors">
                        <td class="p-4 align-top">
                            <div class="font-bold text-slate-800 text-sm md:text-base">${c.name} <span class="${c.status==='Non-Aktif'?'bg-red-100 text-red-600 px-2 py-0.5 rounded text-[10px] ml-1 font-black':'hidden'}">NON-AKTIF</span></div>
                            <div class="text-xs text-slate-600 flex items-center gap-1 mt-1 font-medium"><i data-lucide="phone" class="w-3 h-3"></i> ${c.phone}</div>
                            <div class="text-xs text-slate-500 flex items-start gap-1 mt-1 whitespace-normal leading-relaxed max-w-[250px]"><i data-lucide="map-pin" class="w-3 h-3 mt-0.5 flex-shrink-0"></i> ${c.address || '-'}</div>
                        </td>
                        <td class="p-4 align-top">
                            <div class="text-slate-600 text-xs md:text-sm font-bold bg-slate-100 px-2 py-1 rounded w-max">${pkgDisplay}</div>
                            <div class="text-sm font-black text-blue-600 mt-1.5">${formatRp(tagihan)} ${c.customPrice ? '<span class="text-amber-600 text-[10px] uppercase ml-1">(Khusus)</span>' : ''}</div>
                        </td>
                        <td class="p-4 align-top">
                            <div class="flex items-center">${payBadge}</div>
                            ${payNote}
                        </td>
                        <td class="p-4 align-top">
                            <div class="flex gap-2">
                                ${editPriceBtn}
                                <button onclick="openModalCustomer('${c.id}')" class="text-blue-600 bg-blue-50 hover:bg-blue-100 p-2.5 rounded-lg transition-colors border border-blue-200 flex items-center justify-center shadow-sm" title="Edit Data">
                                    <i data-lucide="edit-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            if(trs === '') trs = `<tr><td colspan="4" class="p-10 text-center text-slate-500 font-medium"><div class="flex flex-col items-center gap-2"><i data-lucide="folder-search" class="w-10 h-10 text-slate-300"></i>Tidak ada data pelanggan.</div></td></tr>`;

            return trs;
        }

        function getViewCustomers() {
            const monthKey = window.selectedMonth;
            let trs = getCustomerRowsHTML();

            return `
                <div class="space-y-4 md:space-y-6 max-w-7xl mx-auto">

                        <h2 class="text-2xl font-extrabold text-slate-800 flex items-center gap-2"><i data-lucide="users" class="w-6 h-6 text-blue-600"></i> Daftar Pelanggan</h2>

        window.exportCustomersCSV = function() {
            const monthKey = window.selectedMonth;
            const headers = ['ID', 'Nama', 'Alamat', 'No. HP', 'Paket', 'Nominal Tagihan', 'Tgl Jatuh Tempo', 'Status Berlangganan', 'Status Pembayaran Bulan Ini'];
            
            const rows = state.customers.map(c => {
                const pkg = state.packages.find(p => p.id === c.packageId);
                const pkgName = pkg ? pkg.name : '-';
                let tagihan = pkg ? pkg.price : 0;
                if (c.customPrice && Number(c.customPrice) > 0) tagihan = Number(c.customPrice);

                const pay = state.payments.find(p => p.customerId === c.id && p.month === monthKey);
                let payStat = 'Belum Ditagih';
                if(pay) payStat = pay.status === 'Lunas' ? `Lunas (${pay.method})` : `Belum Bayar (${pay.reason})`;

                return `"${c.id}";"${c.name}";"${c.address || ''}";"${c.phone}";"${pkgName}";"${tagihan}";"${c.dueDate}";"${c.status}";"${payStat}"`;
            });
            const csvContent = "\uFEFF" + [headers.join(';'), ...rows].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.setAttribute("href", URL.createObjectURL(blob));
            link.setAttribute("download", `Data_Pelanggan_${monthKey}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.downloadTemplateCSV = function() {
            const headers = ['Nama Lengkap', 'Alamat Lengkap', 'No Handphone'];
            const rows = [
                ['Budi Santoso', 'Jl. Merdeka No 1', '081234567890'],
                ['Siti Aminah', 'Perumahan Asri Blok C2', '089876543210']
            ];
            let csvContent = "\uFEFF" + headers.join(';') + '\n' + rows.map(e => e.join(';')).join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.setAttribute("href", URL.createObjectURL(blob));
            link.setAttribute("download", "Template_Simple_Pelanggan.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.processImportCSV = async function() {
            const pkgId = document.getElementById('csv-pkg').value;
            const due = document.getElementById('csv-due').value;
            const status = document.getElementById('csv-status').value;
            const fileInput = document.getElementById('csv-file');

            let errors = [];
            if (!pkgId) errors.push("- Paket Internet belum dipilih!");
            if (!fileInput.files.length) errors.push("- Anda belum memasukkan file CSV!");

            if (errors.length > 0) { showToast("Import Gagal", "Paket Internet dan File CSV wajib diisi!", "error"); return; }

            const file = fileInput.files[0];
            const reader = new FileReader();
            
            reader.onload = async function(e) {
                const text = e.target.result;
                const rows = text.split('\n');
                if (rows.length < 2) { showToast("Import Gagal", "File CSV kosong atau format salah!", "error"); return; }

                const header = rows[0].toLowerCase();
                const separator = header.includes(';') ? ';' : ',';
                const headers = header.split(separator).map(h => h.replace(/['"]+/g, '').trim());

                let idxName = headers.findIndex(h => h.includes('nama'));
                let idxPhone = headers.findIndex(h => h.includes('hp') || h.includes('phone') || h.includes('telepon'));
                let idxAddr = headers.findIndex(h => h.includes('alamat') || h.includes('address'));

                if (idxName === -1) idxName = 0; 
                if (idxAddr === -1 && headers.length >= 2) idxAddr = 1; 
                if (idxPhone === -1 && headers.length >= 3) idxPhone = 2; 

                let successCount = 0;
                for (let i = 1; i < rows.length; i++) {
                    const line = rows[i].trim();
                    if (!line) continue;
                    const cols = line.split(separator).map(c => c.replace(/['"]+/g, '').trim());
                    if (cols.length < 2 || !cols[idxName]) continue;

                    state.customers.push({
                        id: generateId(), 
                        name: cols[idxName], 
                        address: (idxAddr !== -1 && cols[idxAddr]) ? cols[idxAddr] : '-', 
                        phone: (idxPhone !== -1 && cols[idxPhone]) ? cols[idxPhone] : '-',
                        packageId: pkgId, 
                        dueDate: due, 
                        status: status, 
                        customPrice: ''
                    });
                    successCount++;
                }

                closeModal();
                renderMenuContent();
                showToast("Import Sukses", `Berhasil memasukkan ${successCount} data pelanggan.`, "success");
                await syncToDatabase("Menyimpan Data Import...");
            };
            reader.readAsText(file);
        }

                            <h3 class="text-lg font-extrabold text-slate-800 flex items-center gap-2"><i data-lucide="credit-card" class="w-5 h-5 text-blue-600"></i> Proses Pembayaran</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-800 bg-white p-1.5 rounded-full shadow-sm"><i data-lucide="x" class="w-4 h-4"></i></button>
                        </div>
                        <div class="overflow-y-auto custom-scrollbar">
                            <form onsubmit="savePayment(event, '${custId}', ${tagihan})" class="p-6 space-y-5">
                                <div class="bg-slate-100/50 p-4 rounded-xl border border-slate-200 text-center">
                                    <p class="text-xs text-slate-500 font-black uppercase tracking-wider mb-1">Total Tagihan</p>
                                    <p class="text-3xl font-extrabold text-blue-700 bg-white py-2 rounded-lg border border-blue-100 shadow-sm">${formatRp(tagihan)}</p>
                                    <p class="text-sm font-bold text-slate-700 mt-3">${cust.name}</p>
                                </div>
                                
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-1.5">Status Penagihan</label>
                                    <select id="pay-status" onchange="togglePaymentFields(this.value)" class="w-full px-4 py-3 border-2 border-slate-200 rounded-xl outline-none focus:border-blue-500 bg-white font-bold cursor-pointer transition-colors shadow-sm">
                                        <option value="Lunas" ${pay.status==='Lunas'?'selected':''}>✅ Sudah Lunas (Bayar)</option>
                                        <option value="Belum Bayar" ${pay.status==='Belum Bayar'?'selected':''}>❌ Belum Bayar (Nunggak)</option>
                                    </select>
                                </div>
                                
                                <div id="fields-lunas" class="space-y-4 ${pay.status==='Lunas'?'block':'hidden'} bg-emerald-50/50 p-4 rounded-xl border border-emerald-100">
                                    <div>
                                        <label class="block text-sm font-bold text-slate-700 mb-1.5">Metode Pembayaran</label>
                                        <select id="pay-method" class="w-full px-4 py-3 border border-emerald-200 rounded-xl outline-none focus:border-emerald-500 bg-white font-bold cursor-pointer shadow-sm">
                                            <option value="Cash" ${pay.method==='Cash'?'selected':''}>💵 Cash (Tunai)</option>
                                            <option value="Transfer" ${pay.method==='Transfer'?'selected':''}>💳 Transfer Bank</option>

                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-bold text-slate-700 mb-1.5">Tanggal Bayar</label>
                                        <input type="date" id="pay-date" value="${pay.date}" class="w-full px-4 py-3 border border-emerald-200 rounded-xl outline-none focus:border-emerald-500 bg-white font-bold shadow-sm">
                                    </div>
                                </div>
                                
                                <div id="fields-nunggak" class="space-y-4 ${pay.status==='Belum Bayar'?'block':'hidden'} bg-red-50/50 p-4 rounded-xl border border-red-100">
                                    <div>
                                        <label class="block text-sm font-bold text-slate-700 mb-1.5">Alasan Nunggak / Keterangan</label>
                                        <input type="text" id="pay-reason" value="${pay.reason}" placeholder="Cth: Orang tidak ada di rumah" class="w-full px-4 py-3 border border-red-200 rounded-xl outline-none focus:border-red-500 bg-white font-bold shadow-sm">
                                    </div>
                                </div>

                                <div class="pt-4 flex justify-end gap-3 border-t border-slate-100">
                                    <button type="submit" class="w-full px-5 py-3.5 text-sm font-bold text-white bg-blue-600 rounded-xl hover:bg-blue-700 shadow-md flex items-center justify-center gap-2 transition-colors"><i data-lucide="check-circle" class="w-5 h-5"></i> Simpan Status Tagihan</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-root').innerHTML = html;
            lucide.createIcons();
        }

        window.togglePaymentFields = function(val) {
            const lunas = document.getElementById('fields-lunas');
            const nunggak = document.getElementById('fields-nunggak');
            if(val === 'Lunas') {
                lunas.classList.remove('hidden'); lunas.classList.add('block');
                nunggak.classList.remove('block'); nunggak.classList.add('hidden');
            } else {
                nunggak.classList.remove('hidden'); nunggak.classList.add('block');
                lunas.classList.remove('block'); lunas.classList.add('hidden');
            }
        }

        window.savePayment = async function(e, custId, amount) {
            e.preventDefault();
            const status = document.getElementById('pay-status').value;
            const method = status === 'Lunas' ? document.getElementById('pay-method').value : '';

            // DATANG KE KANTOR OTOMATIS MASUK LAPORAN ADMIN
            let finalTechId = currentUser.id;
            if (status === 'Lunas' && method === 'Datang ke Kantor') {
                finalTechId = 'admin';
            }

            // CEGAH DATA DOBEL/TUMPANG TINDIH & PASTIKAN LAPORAN BERKURANG JIKA DIEDIT
            const existingPay = state.payments.find(p => p.customerId === custId && p.month === window.selectedMonth);
            const payId = existingPay ? existingPay.id : generateId();

            const data = {
                id: payId, 
                customerId: custId, 
                month: window.selectedMonth, 
                status: status,
                amount: status === 'Lunas' ? amount : 0, 
                method: method,
                date: status === 'Lunas' ? document.getElementById('pay-date').value : '', 
                reason: status === 'Belum Bayar' ? document.getElementById('pay-reason').value : '',
                technicianId: finalTechId 
            };
            
            const idx = state.payments.findIndex(p => p.customerId === custId && p.month === window.selectedMonth);
            if (idx >= 0) state.payments[idx] = data;
            else state.payments.push(data);
            
            closeModal();
            renderMenuContent();
            await syncToDatabase("Menyimpan Tagihan...");
            
            setTimeout(() => {
                showToast("Pembayaran Sukses", "Data tagihan telah disimpan ke dalam database.", "success");
            }, 300);
        }

        window.changeReportFilter = function(val) {
            window.reportFilterDue = val;
            renderMenuContent();
        }

        function getViewReports() {
            const monthKey = window.selectedMonth;
            let allLunas = state.payments.filter(p => p.month === monthKey && p.status === 'Lunas');
            
            // FILTER TANGGAL JATUH TEMPO
            if (window.reportFilterDue && window.reportFilterDue !== 'all') {
                allLunas = allLunas.filter(p => {
                    let cust = state.customers.find(c => c.id === p.customerId);
                    return cust && String(cust.dueDate) === String(window.reportFilterDue);
                });
            }

            let reportData = [];
            if (userRole === 'admin') {
                reportData = state.technicians.map(t => {
                    const techPayments = allLunas.filter(p => String(p.technicianId) === String(t.id));
                    const rev = techPayments.reduce((sum, p) => sum + Number(p.amount), 0);
                    return { techId: t.id, name: t.name, revenue: rev, trxCount: techPayments.length };
                });
                
                // ADMINISTRATOR (Memasukkan "Datang ke Kantor" juga)
                const adminPayments = allLunas.filter(p => p.technicianId === 'admin' || !p.technicianId || p.method === 'Datang ke Kantor');
                if(adminPayments.length > 0) {
                    const adminRev = adminPayments.reduce((sum, p) => sum + Number(p.amount), 0);
                    reportData.unshift({ techId: 'admin', name: 'Administrator (Pusat)', revenue: adminRev, trxCount: adminPayments.length });
                }
            } else {
                const techPayments = allLunas.filter(p => String(p.technicianId) === String(currentUser.id));
                const rev = techPayments.reduce((sum, p) => sum + Number(p.amount), 0);
                reportData = [{ techId: currentUser.id, name: currentUser.name, revenue: rev, trxCount: techPayments.length }];
            }

            let totalOmset = reportData.reduce((sum, r) => sum + r.revenue, 0);

            let cards = reportData.map(r => `
                <div class="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm hover:shadow-md transition-shadow relative overflow-hidden group flex flex-col justify-between">
                    <div class="absolute -right-4 -bottom-4 opacity-5 group-hover:scale-110 transition-transform"><i data-lucide="receipt" class="w-32 h-32 text-blue-600"></i></div>
                    <div class="flex items-start gap-4 mb-5 relative z-10">
                        <div class="w-14 h-14 rounded-2xl bg-blue-50 flex items-center justify-center text-blue-700 font-black text-xl border border-blue-200 shadow-sm flex-shrink-0">${r.name.charAt(0)}</div>
                        <div class="flex-1">
                            <p class="font-black text-slate-800 text-lg leading-tight">${r.name}</p>
                            <p class="text-xs text-slate-500 font-bold bg-slate-100 px-2.5 py-1 rounded-md w-max mt-2 border border-slate-200 shadow-inner">${r.trxCount} Pembayaran Diterima</p>
                        </div>
                    </div>
                    <div class="pt-5 border-t border-slate-100 relative z-10 flex justify-between items-end gap-2">
                        <div>
                            <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Setoran Terkumpul</p>
                            <p class="text-2xl font-black text-blue-700">${formatRp(r.revenue)}</p>
                        </div>
                        <button onclick="downloadLaporanPDF('${r.techId}', '${r.name}')" class="bg-slate-800 hover:bg-black text-white px-4 py-2.5 rounded-xl shadow-sm transition-colors flex items-center justify-center gap-2 text-sm font-bold" title="Download PDF Laporan">
                            <i data-lucide="download" class="w-4 h-4"></i> PDF
                        </button>
                    </div>
                </div>
            `).join('');

            if(cards === '') cards = `<div class="col-span-full p-8 text-center text-slate-500 font-medium">Belum ada data laporan bulan ini.</div>`;

            return `
                <div class="space-y-6 max-w-5xl mx-auto">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="flex flex-col gap-1">
                            <h2 class="text-2xl font-extrabold text-slate-800 flex items-center gap-2"><i data-lucide="file-text" class="w-6 h-6 text-blue-600"></i> Laporan Keuangan</h2>
                            <p class="text-sm text-slate-500">Periode laporan: <span class="font-bold text-blue-600">${formatMonthName(monthKey)}</span></p>
                        </div>

                        <div class="flex items-center gap-2 bg-white px-4 py-2 rounded-xl border border-slate-200 shadow-sm w-full md:w-auto">
                            <i data-lucide="filter" class="w-4 h-4 text-slate-400"></i>
                            <select onchange="changeReportFilter(this.value)" class="w-full bg-transparent outline-none text-sm font-bold text-slate-700 cursor-pointer">
                                <option value="all" ${window.reportFilterDue === 'all' ? 'selected' : ''}>Semua Tanggal Tagihan</option>
                                <option value="15" ${window.reportFilterDue === '15' ? 'selected' : ''}>Hanya Tagihan Tgl 15</option>
                                <option value="25" ${window.reportFilterDue === '25' ? 'selected' : ''}>Hanya Tagihan Tgl 25</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${cards}
                    </div>

                    <div class="bg-gradient-to-r from-blue-700 to-blue-600 p-8 rounded-2xl text-white shadow-xl flex flex-col md:flex-row items-center justify-between gap-6 border border-blue-800 relative overflow-hidden mt-4">
                        <div class="absolute -left-10 -bottom-10 opacity-10"><i data-lucide="banknote" class="w-64 h-64 text-white"></i></div>
                        <div class="relative z-10 flex items-center gap-4">
                            <div class="bg-white/10 p-3 rounded-2xl backdrop-blur-sm border border-white/20"><i data-lucide="wallet" class="w-8 h-8 text-white"></i></div>
                            <div>
                                <h3 class="text-lg font-bold text-blue-100">Total Omset ${userRole === 'admin' ? 'Keseluruhan' : 'Anda'}</h3>
                                <p class="text-sm text-blue-200">Uang masuk yang berhasil ditagih bulan ini</p>
                            </div>
                        </div>
                        <p class="text-4xl md:text-5xl font-black relative z-10 drop-shadow-md">${formatRp(totalOmset)}</p>
                    </div>
                </div>
            `;
        }

        window.downloadLaporanPDF = function(techId, techName) {
            showLoading("Memproses File PDF...");
            
            const monthKey = window.selectedMonth;
            let techPayments = state.payments.filter(p => p.month === monthKey && p.status === 'Lunas');

            if (String(techId) === 'admin') {
                techPayments = techPayments.filter(p => String(p.technicianId) === 'admin' || !p.technicianId || p.method === 'Datang ke Kantor');
            } else {
                techPayments = techPayments.filter(p => String(p.technicianId) === String(techId));
            }
            
            let titleFilter = "";
            if (window.reportFilterDue && window.reportFilterDue !== 'all') {
                techPayments = techPayments.filter(p => {
                    let cust = state.customers.find(c => c.id === p.customerId);
                    return cust && String(cust.dueDate) === String(window.reportFilterDue);
                });
                titleFilter = " (Tgl " + window.reportFilterDue + ")";
            }

            let rows = techPayments.map((p, i) => {
                let cust = state.customers.find(c => c.id === p.customerId) || {};
                const pkg = state.packages.find(pk => pk.id === cust.packageId);
                let pkgName = pkg ? pkg.name : '-';
                
                let printDate = p.date;
                if (printDate && String(printDate).includes('T')) {
                    const dObj = new Date(printDate);
                    if (!isNaN(dObj.getTime())) {
                        printDate = dObj.toLocaleDateString('id-ID');
                    }
                }

                return `
                    <tr style="border-bottom: 1px solid #ddd; background-color: #fff;">
                        <td style="padding: 12px 8px; text-align: center; border: 1px solid #ddd; color: #000;">${i+1}</td>
                        <td style="padding: 12px 8px; border: 1px solid #ddd; color: #000;"><strong>${cust.name || 'Unknown'}</strong><br><span style="font-size:10px;color:#555;">${cust.phone || '-'}</span></td>
                        <td style="padding: 12px 8px; border: 1px solid #ddd; color: #000;">${pkgName}</td>
                        <td style="padding: 12px 8px; border: 1px solid #ddd; color: #000;">${printDate}</td>
                        <td style="padding: 12px 8px; border: 1px solid #ddd; color: #000;">${p.method}</td>
                        <td style="padding: 12px 8px; text-align: right; border: 1px solid #ddd; color: #000;"><strong>${formatRp(p.amount)}</strong></td>
                    </tr>
                `;
            }).join('');
            
            let total = techPayments.reduce((sum, p) => sum + Number(p.amount), 0);

            const htmlContent = `
                <div style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; padding: 40px; color: #000; width: 100%; box-sizing: border-box; background-color: #ffffff;">
                    <div style="border-bottom: 3px solid #2563eb; padding-bottom: 15px; margin-bottom: 25px; text-align: center;">
                        <h1 style="margin: 0; color: #2563eb; font-size: 26px; font-weight: 800; text-transform: uppercase;">Laporan Setoran Teknisi${titleFilter}</h1>
                        <p style="margin: 5px 0 0 0; color: #555; font-size: 14px;">Periode Penagihan: ${formatMonthName(monthKey)}</p>
                    </div>
                    
                    <table style="width: 100%; margin-bottom: 25px; font-size: 14px; border: none; background-color: #ffffff;">
                        <tr>
                            <td style="width: 120px; font-weight: bold; color: #333;">Nama Teknisi</td>
                            <td style="font-weight: bold; color: #000;">: ${techName}</td>
                            <td style="text-align: right; color: #555;">Tanggal Cetak: ${new Date().toLocaleDateString('id-ID')}</td>
                        </tr>
                    </table>
                    
                    <table style="width: 100%; border-collapse: collapse; font-size: 13px; border: 1px solid #ccc; background-color: #ffffff;">
                        <thead style="background-color: #f1f5f9;">
                            <tr style="text-align: left; color: #000;">
                                <th style="padding: 14px 8px; text-align: center; border: 1px solid #ddd;">No</th>
                                <th style="padding: 14px 8px; border: 1px solid #ddd;">Nama Pelanggan</th>
                                <th style="padding: 14px 8px; border: 1px solid #ddd;">Paket Internet</th>
                                <th style="padding: 14px 8px; border: 1px solid #ddd;">Tgl Bayar</th>
                                <th style="padding: 14px 8px; border: 1px solid #ddd;">Metode</th>
                                <th style="padding: 14px 8px; text-align: right; border: 1px solid #ddd;">Nominal</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows || '<tr style="background-color: #fff;"><td colspan="6" style="padding: 20px; text-align: center; color: #666; border: 1px solid #ddd;">Belum ada data setoran untuk teknisi ini pada bulan terpilih.</td></tr>'}
                        </tbody>
                        <tfoot>
                            <tr style="background-color: #eff6ff; font-weight: bold;">
                                <td colspan="5" style="padding: 15px 10px; text-align: right; color: #000; border: 1px solid #ddd;">TOTAL SETORAN (${techPayments.length} TRX) :</td>
                                <td style="padding: 15px 10px; text-align: right; color: #000; border: 1px solid #ddd; font-size: 15px;">${formatRp(total)}</td>
                            </tr>
                        </tfoot>
                    </table>
                    
                    <div style="text-align: right; margin-top: 50px; font-size: 14px; color: #333; page-break-inside: avoid;">
                        <div style="display: inline-block; text-align: center; width: 220px;">
                            <p style="margin-bottom: 80px;">Diterima Oleh,</p>
                            <p style="font-weight: bold; border-bottom: 1px solid #000; padding-bottom: 5px; margin-bottom: 5px;">Administrator / Keuangan</p>
                            <p style="font-size: 11px; color: #666;">BayarQue System</p>
                        </div>
                    </div>
                </div>
            `;

            if(typeof html2pdf !== 'undefined') {
                const opt = {
                    margin:       0.3, 
                    filename:     `Laporan_Setoran_${techName.replace(/\s+/g, '_')}_${monthKey}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, useCORS: true, logging: false },
                    jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
                };

                // PENTING: Memproses string HTML menjadi DOM Element agar PDF tidak blank.
                const tempElement = document.createElement('div');
                tempElement.innerHTML = htmlContent;

                html2pdf().set(opt).from(tempElement).save().then(() => {
                    hideLoading();
                }).catch(err => {
                    console.error("PDF Error:", err);
                    hideLoading();
                    showToast("Gagal", "Terjadi kesalahan saat memproses PDF.", "error");
                });
            } else {
                hideLoading();
                showToast("Sistem Error", "Library PDF belum dimuat. Periksa koneksi Anda.", "error");
            }
        }

        function getViewSettings() {
            if(userRole !== 'admin') return `<div class="p-8 text-center text-red-500 font-bold">Akses Ditolak.</div>`;
            return `
                <div class="space-y-6 max-w-2xl mx-auto">
                    <div>
                        <h2 class="text-2xl font-extrabold text-slate-800 flex items-center gap-2"><i data-lucide="settings" class="w-6 h-6 text-blue-600"></i> Pengaturan Sistem</h2>
                        <p class="text-sm text-slate-500 mt-1">Atur koneksi Google Sheets dan ubah kata sandi admin.</p>
                    </div>

                    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                        <h3 class="font-extrabold text-slate-800 mb-6 flex items-center gap-2 border-b border-slate-100 pb-3"><i data-lucide="database" class="w-5 h-5 text-emerald-500"></i> Koneksi Google Sheets (Database)</h3>
                        <div class="mb-8 space-y-4">
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1.5">URL Web App (Google Apps Script)</label>
                                ${DATABASE_URL ? 
                                    `<div class="w-full px-4 py-3 border-2 border-emerald-200 bg-emerald-50 rounded-xl font-medium text-emerald-700 break-all"><i data-lucide="lock" class="w-4 h-4 inline mb-0.5"></i> URL Database telah dikunci secara permanen di dalam sistem aplikasi. Anda siap menggunakannya!</div>` :
                                    `<input type="text" id="set-url" value="${localStorage.getItem('bayarque_script_url') || ''}" placeholder="https://script.google.com/macros/s/..." class="w-full px-4 py-3 border-2 border-slate-200 rounded-xl outline-none focus:border-emerald-500 bg-slate-50 focus:bg-white font-medium transition-colors">
                                     <p class="text-xs text-slate-500 mt-2 font-medium">Masukkan link hasil <span class="font-bold">Deploy as Web App</span> dari <i>Code.gs</i> Anda. Pastikan akses di-set ke <span class="font-bold text-emerald-600">"Anyone"</span>.</p>`
                                }
                            </div>
                        </div>
                    
                        <h3 class="font-extrabold text-slate-800 mb-6 flex items-center gap-2 border-b border-slate-100 pb-3"><i data-lucide="shield" class="w-5 h-5 text-slate-500"></i> Keamanan Akun Admin</h3>
                        <form onsubmit="saveSettings(event)" class="space-y-5">
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1.5">Username Admin</label>
                                <input type="text" id="set-user" required value="${state.admin.user}" class="w-full px-4 py-3 border-2 border-slate-200 rounded-xl outline-none focus:border-blue-500 bg-slate-50 focus:bg-white font-bold transition-colors">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1.5">Password Admin</label>
                                <input type="text" id="set-pass" required value="${state.admin.pass}" class="w-full px-4 py-3 border-2 border-slate-200 rounded-xl outline-none focus:border-blue-500 bg-slate-50 focus:bg-white font-bold transition-colors">
                            </div>
                            <div class="pt-4 mt-2 border-t border-slate-100">
                                <button type="submit" class="w-full mt-4 px-5 py-3.5 text-sm font-bold text-white bg-blue-600 rounded-xl hover:bg-blue-700 shadow-md flex items-center justify-center gap-2 transition-colors"><i data-lucide="save" class="w-4 h-4"></i> Simpan Semua Pengaturan</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        window.saveSettings = async function(e) {
            e.preventDefault();
            
            let url = DATABASE_URL;
            let prevUrl = localStorage.getItem('bayarque_script_url');
            
            if (!DATABASE_URL) {
                url = document.getElementById('set-url').value.trim();
                localStorage.setItem('bayarque_script_url', url);
            }
            
            state.admin.user = document.getElementById('set-user').value;
            state.admin.pass = document.getElementById('set-pass').value;
            
            showToast("Berhasil Disimpan", "Pengaturan sistem berhasil diperbarui.", "success");
            
            if(url && url !== prevUrl) {
                window.location.reload();
            } else {
                await syncToDatabase("Menyimpan Pengaturan...");
            }
        }
    </script>
</body>
</html>
