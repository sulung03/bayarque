<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BayarQue - Billing Internet</title>
    <link href="https://fonts.cdnfonts.com/css/demonized" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        .slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        input[type="month"]::-webkit-calendar-picker-indicator {
            filter: invert(0.6);
            cursor: pointer;
        }

        /* Scrollbar kustom untuk tabel agar lebih cantik di desktop */
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Animasi Pop untuk navigasi bawah */
        .nav-active-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { 0% { transform: scale(0.8); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased overflow-hidden">

    <div id="app" class="h-screen w-screen flex flex-col md:flex-row overflow-hidden">
        <div class="flex flex-col items-center justify-center w-full h-full space-y-4">
            <i data-lucide="loader-2" class="animate-spin text-blue-600 w-12 h-12"></i>
            <p class="text-slate-500 font-medium">Memuat Aplikasi BayarQue...</p>
        </div>
    </div>

    <!-- Overlay Loading Global -->
    <div id="loading-overlay" class="fixed inset-0 bg-slate-900/60 z-[60] flex-col items-center justify-center hidden backdrop-blur-sm transition-opacity">
        <i data-lucide="loader-2" class="animate-spin text-white w-12 h-12 mb-3"></i>
        <p id="loading-text" class="text-white font-medium text-lg">Memproses data...</p>
    </div>

    <!-- Container untuk Notifikasi Toast (Pesan Cantik) -->
    <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-3 pointer-events-none *:pointer-events-auto"></div>

    <div id="modal-root"></div>

    <script>
        // =========================================================
        // KONFIGURASI DATABASE PERMANEN
        // =========================================================
        const DATABASE_URL = "https://script.google.com/macros/s/AKfycbyjdyvM5Fu_Nm55WW74zaYF2ckpSQmCGZVAUHwF-5JZNlIZtb7Fybp6Y27cDe12pxIK-w/exec"; 

        // Fungsi Notifikasi Cantik (Toast)
        window.showToast = function(title, message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            
            const toastId = 'toast_' + Math.random().toString(36).substr(2, 9);
            let bgColor = 'bg-emerald-500';
            let icon = 'check-circle';
            
            if (type === 'error') { bgColor = 'bg-red-500'; icon = 'x-circle'; }
            else if (type === 'warning') { bgColor = 'bg-amber-500'; icon = 'alert-triangle'; }
            else if (type === 'info') { bgColor = 'bg-blue-500'; icon = 'info'; }
            
            const toastHTML = `
                <div id="${toastId}" class="flex items-start gap-3 p-4 ${bgColor} text-white rounded-xl shadow-lg transform transition-all duration-300 translate-x-full opacity-0 max-w-sm border border-white/20">
                    <i data-lucide="${icon}" class="w-6 h-6 flex-shrink-0 drop-shadow-sm"></i>
                    <div class="flex-1">
                        <h4 class="font-extrabold text-sm tracking-wide">${title}</h4>
                        <p class="text-xs text-white/90 mt-1 leading-relaxed font-medium">${message}</p>
                    </div>
                    <button onclick="document.getElementById('${toastId}').remove()" class="text-white/70 hover:text-white transition-colors bg-black/10 hover:bg-black/20 p-1 rounded-lg">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
            `;
            
            container.insertAdjacentHTML('beforeend', toastHTML);
            lucide.createIcons();
            
            const toastEl = document.getElementById(toastId);
            requestAnimationFrame(() => {
                toastEl.classList.remove('translate-x-full', 'opacity-0');
                toastEl.classList.add('translate-x-0', 'opacity-100');
            });
            
            setTimeout(() => {
                if(document.getElementById(toastId)) {
                    toastEl.classList.remove('translate-x-0', 'opacity-100');
                    toastEl.classList.add('translate-x-full', 'opacity-0');
                    setTimeout(() => { toastEl.remove(); }, 300); 
                }
            }, 3500);
        }

        let state = {
            packages: [],
            technicians: [],
            customers: [],
            payments: [],
            admin: { user: 'admin', pass: 'admin123' }
        };

        let currentUser = null; 
        let userRole = null; 
        let currentMenu = 'dashboard';
        let isMobileMenuOpen = false;
        let isBottomMoreOpen = false; 

        window.selectedMonth = new Date().toISOString().slice(0, 7); 
        window.showPaid15 = false;
        window.showPaid25 = false;

        window.toggleShowPaid = function(due) {
            if (Number(due) === 15) window.showPaid15 = !window.showPaid15;
            if (Number(due) === 25) window.showPaid25 = !window.showPaid25;
            renderMenuContent();
        }

        async function syncToDatabase(loadingMessage = "Menyimpan ke Google Sheets...") {
            const url = DATABASE_URL || localStorage.getItem('bayarque_script_url');
            if (!url) return;
            
            showLoading(loadingMessage);
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    body: JSON.stringify(state)
                });
                const result = await response.json();
                if(result.status !== 'success') throw new Error("Gagal menyimpan data ke server");
            } catch (error) {
                console.error("Gagal sinkron:", error);
                const modalRoot = document.getElementById('modal-root');
                modalRoot.innerHTML = `
                    <div class="fixed inset-0 bg-slate-900/60 z-[70] flex justify-center items-center p-4">
                        <div class="bg-white rounded-xl p-6 max-w-sm w-full text-center fade-in">
                            <i data-lucide="alert-triangle" class="w-12 h-12 text-red-500 mx-auto mb-3"></i>
                            <h3 class="font-bold text-lg text-slate-800">Gagal Menyimpan</h3>
                            <p class="text-sm text-slate-500 mt-2">Tidak dapat terhubung ke Google Sheets. Periksa URL Web App di menu Pengaturan atau koneksi internet Anda.</p>
                            <button onclick="closeModal()" class="mt-5 bg-red-500 hover:bg-red-600 text-white px-6 py-2.5 rounded-lg font-bold transition-colors">Tutup</button>
                        </div>
                    </div>
                `;
                lucide.createIcons();
            }
            hideLoading();
        }

        async function loadFromGoogleSheets(url) {
            showLoading("Mengunduh data dari Google Sheets...");
            try {
                const cacheBuster = new Date().getTime();
                const fetchUrl = url + (url.includes('?') ? '&' : '?') + 'nocache=' + cacheBuster;
                
                const response = await fetch(fetchUrl);
                const data = await response.json();
                
                if(data.packages) state.packages = data.packages;
                if(data.technicians) state.technicians = data.technicians;
                
                if(data.customers) {
                    state.customers = data.customers.map(c => ({
                        ...c,
                        id: String(c.id).trim(),
                        packageId: String(c.packageId).trim()
                    }));
                }
                
                if(data.payments) {
                    state.payments = data.payments.map(p => {
                        let parsedMonth = String(p.month).trim();
                        if (parsedMonth.includes('T')) {
                            const d = new Date(parsedMonth);
                            if (!isNaN(d.getTime())) {
                                parsedMonth = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0');
                            }
                        }
                        return {
                            ...p,
                            customerId: String(p.customerId).trim(),
                            month: parsedMonth,
                            status: String(p.status).trim()
                        };
                    });
                }
                
                if(data.admin && data.admin.user) state.admin = data.admin;
                
                checkSessionAndRender();
            } catch (error) {
                console.error("Gagal mengambil data:", error);
                checkSessionAndRender(true);
                setTimeout(() => {
                    showToast("Koneksi Gagal", "Pastikan URL Apps Script benar dan status aksesnya 'Anyone'.", "error");
                }, 500);
            }
            hideLoading();
        }

        window.onload = async function() {
            const url = DATABASE_URL || localStorage.getItem('bayarque_script_url');
            if (url) {
                await loadFromGoogleSheets(url);
            } else {
                checkSessionAndRender(true);
                setTimeout(() => {
                    showToast("Belum Terhubung", "Buka menu Pengaturan dan masukkan URL Apps Script Anda.", "warning");
                }, 1000);
            }
        };

        function checkSessionAndRender(isOffline = false) {
            const savedSession = localStorage.getItem('bayarque_session');
            if (savedSession && !currentUser) {
                const sessionData = JSON.parse(savedSession);
                currentUser = sessionData.user;
                userRole = sessionData.role;
            }
            renderApp();
            
            if (isOffline && currentUser) {
                const main = document.getElementById('main-content');
                if(main) {
                    main.insertAdjacentHTML('afterbegin', `
                        <div class="bg-amber-50 border border-amber-200 text-amber-800 p-4 rounded-xl mb-6 flex items-start gap-3 fade-in shadow-sm">
                            <i data-lucide="alert-triangle" class="w-6 h-6 text-amber-600 flex-shrink-0"></i>
                            <div>
                                <p class="font-bold">Mode Lokal Terdeteksi</p>
                                <p class="text-sm">URL Google Sheets belum diatur atau koneksi terputus. Data saat ini belum tersinkronisasi.</p>
                            </div>
                        </div>
                    `);
                    lucide.createIcons();
                }
            }
        }

        function showLoading(text) {
            document.getElementById('loading-text').innerText = text;
            const overlay = document.getElementById('loading-overlay');
            overlay.classList.remove('hidden'); overlay.classList.add('flex');
        }

        function hideLoading() {
            const overlay = document.getElementById('loading-overlay');
            overlay.classList.add('hidden'); overlay.classList.remove('flex');
        }

        function generateId() { return 'id_' + Math.random().toString(36).substr(2, 9); }
        function formatRp(angka) { return "Rp " + Number(angka).toLocaleString('id-ID'); }
        function formatMonthName(yyyyMm) {
            if(!yyyyMm) return '';
            const [y, m] = yyyyMm.split('-');
            const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            return `${months[parseInt(m)-1]} ${y}`;
        }

        window.changeGlobalMonth = function(val) {
            if(!val) return;
            window.selectedMonth = val;
            renderApp(); 
        };

        function getMonthOptionsHTML(selected) {
            const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            const currentYear = new Date().getFullYear();
            let options = '';
            for (let y = currentYear - 1; y <= currentYear + 2; y++) {
                for (let m = 1; m <= 12; m++) {
                    const val = `${y}-${String(m).padStart(2, '0')}`;
                    const label = `${months[m-1]} ${y}`;
                    const isSelected = val === selected ? 'selected' : '';
                    options += `<option value="${val}" ${isSelected} class="bg-slate-800 text-white">${label}</option>`;
                }
            }
            return options;
        }

        function renderApp() {
            const app = document.getElementById('app');
            if (!currentUser) {
                app.innerHTML = getLoginHTML();
            } else {
                app.innerHTML = getLayoutHTML();
                renderMenuContent();
            }
            lucide.createIcons();
        }

        window.switchLoginTab = function(type) {
            document.getElementById('login-type').value = type;
            const btnAdmin = document.getElementById('btn-tab-admin');
            const btnTech = document.getElementById('btn-tab-tech');
            const labelUser = document.getElementById('label-user');
            const inputUser = document.getElementById('login-user');
            const loginTitle = document.getElementById('login-title');

            if(type === 'admin') {
                btnAdmin.className = "flex-1 py-3 text-sm font-bold text-blue-700 bg-white shadow-sm rounded-lg transition-all";
                btnTech.className = "flex-1 py-3 text-sm font-medium text-slate-500 hover:text-slate-700 transition-all";
                labelUser.innerText = "Username Admin";
                inputUser.placeholder = "Masukkan username admin";
                inputUser.type = "text";
                loginTitle.innerText = "Login Administrator";
            } else {
                btnTech.className = "flex-1 py-3 text-sm font-bold text-blue-700 bg-white shadow-sm rounded-lg transition-all";
                btnAdmin.className = "flex-1 py-3 text-sm font-medium text-slate-500 hover:text-slate-700 transition-all";
                labelUser.innerText = "Username Teknisi";
                inputUser.placeholder = "Masukkan username teknisi";
                inputUser.type = "text";
                loginTitle.innerText = "Login Teknisi";
            }
        };

        function getLoginHTML() {
            return `
                <div class="min-h-screen w-full bg-slate-100 flex items-center justify-center p-4 relative overflow-hidden">
                    <div class="absolute inset-0 bg-blue-600/5 z-0"></div>
                    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl z-10 overflow-hidden fade-in border border-slate-100">
                        <div class="bg-blue-600 p-8 text-center relative overflow-hidden">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-24 h-24 text-white/10 absolute -right-4 -bottom-4">
                                <path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>
                                <path d="M8 7v10h3a2 2 0 0 0 0-4H8"/>
                                <path d="M8 13h2.5a2 2 0 0 0 0-4H8"/>
                                <path d="M15 9a4 4 0 0 1 0 6"/>
                                <path d="M18 6a8 8 0 0 1 0 12"/>
                            </svg>
                            <h1 class="text-3xl font-normal tracking-widest relative z-10 font-['Demonized']">
                                <span class="text-white">Bayar</span><span class="text-orange-400">Que</span>
                            </h1>
                            <p class="text-blue-200 mt-2 text-sm font-medium relative z-10">Manajemen Tagihan Internet Cerdas</p>
                        </div>
                        
                        <div class="p-6">
                            <div class="flex p-1 bg-slate-100 rounded-xl mb-6">
                                <button type="button" id="btn-tab-admin" onclick="switchLoginTab('admin')" class="flex-1 py-3 text-sm font-bold text-blue-700 bg-white shadow-sm rounded-lg transition-all">Administrator</button>
                                <button type="button" id="btn-tab-tech" onclick="switchLoginTab('teknisi')" class="flex-1 py-3 text-sm font-medium text-slate-500 hover:text-slate-700 transition-all">Teknisi</button>
                            </div>

                            <form onsubmit="handleLogin(event)" class="space-y-5">
                                <input type="hidden" id="login-type" value="admin">
                                <div id="login-error" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm font-bold border border-red-200 text-center"></div>
                                
                                <div>
                                    <label id="label-user" class="block text-sm font-bold text-slate-700 mb-1.5">Username Admin</label>
                                    <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                            <i data-lucide="user" class="w-5 h-5"></i>
                                        </div>
                                        <input type="text" id="login-user" required placeholder="Masukkan username admin" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 focus:bg-white font-medium transition-colors">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-1.5">Password</label>
                                    <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                            <i data-lucide="lock" class="w-5 h-5"></i>
                                        </div>
                                        <input type="password" id="login-pass" required placeholder="Masukkan password" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 focus:bg-white font-medium transition-colors">
                                    </div>
                                </div>
                                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition-colors shadow-md mt-2 flex items-center justify-center gap-2">
                                    <span id="login-title">Login Administrator</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            `;
        }

        window.handleLogin = function(event) {
            event.preventDefault();
            const type = document.getElementById('login-type').value;
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();

            if (type === 'admin') {
                if (String(u).toLowerCase() === String(state.admin.user).toLowerCase() && String(p) === String(state.admin.pass)) {
                    currentUser = { name: 'Administrator' };
                    userRole = 'admin';
                } else {
                    showLoginError("Username atau password admin salah!");
                    return;
                }
            } else {
                const tech = state.technicians.find(t => 
                    String(t.username || '').toLowerCase() === u.toLowerCase() && 
                    String(t.pass || '') === p
                );
                
                if (tech) {
                    currentUser = tech;
                    userRole = 'teknisi';
                } else {
                    showLoginError("Username teknisi atau password salah!");
                    return;
                }
            }

            localStorage.setItem('bayarque_session', JSON.stringify({ user: currentUser, role: userRole }));
            currentMenu = 'dashboard';
            renderApp();
        }

        function showLoginError(msg) {
            const errorDiv = document.getElementById('login-error');
            errorDiv.innerHTML = `<i data-lucide="alert-circle" class="w-4 h-4 inline mb-0.5"></i> ${msg}`;
            errorDiv.classList.remove('hidden');
            lucide.createIcons();
        }

        window.handleLogout = function() {
            currentUser = null; userRole = null;
            localStorage.removeItem('bayarque_session');
            renderApp();
        }

        window.setMenu = function(menu) {
            currentMenu = menu;
            isMobileMenuOpen = false;
            window.searchCustomer = "";
            window.searchPayment15 = "";
            window.searchPayment25 = "";
            renderApp();
        }

        window.toggleMobileMenu = function() {
            isMobileMenuOpen = !isMobileMenuOpen;
            renderApp();
        }

        function getLayoutHTML() {
            const menus = [
                { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                { id: 'pelanggan', label: 'Pelanggan', icon: 'users' },
                { id: 'paket', label: 'Paket', icon: 'package' },
                { id: 'teknisi', label: 'Manajemen Teknisi', icon: 'wrench', role: 'admin' },
                { id: 'pay15', label: 'Tagihan Tgl 15', icon: 'credit-card' },
                { id: 'pay25', label: 'Tagihan Tgl 25', icon: 'credit-card' },
                { id: 'laporan', label: 'Laporan Keuangan', icon: 'file-text' },
                { id: 'pengaturan', label: 'Pengaturan', icon: 'settings', role: 'admin' },
            ];

            let sidebarHTML = menus.map(m => {
                if (m.role && m.role !== userRole) return ''; 
                const isActive = currentMenu === m.id;
                const isBottomNav = ['dashboard', 'pelanggan', 'pay15', 'pay25', 'pengaturan'].includes(m.id);
                // Sembunyikan item spesifik di mobile karena sudah ada di bottom nav
                const displayClass = isBottomNav ? 'hidden md:flex' : 'flex';
                
                return `
                    <button onclick="setMenu('${m.id}')" class="w-full ${displayClass} items-center gap-3 px-4 py-3 rounded-md transition-colors ${isActive ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}">
                        <i data-lucide="${m.icon}" class="w-5 h-5"></i>
                        <span class="font-medium text-sm md:text-base">${m.label}</span>
                    </button>
                `;
            }).join('');

            return `
                <div class="${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 fixed md:relative z-40 inset-y-0 left-0 w-64 bg-slate-900 text-white transition-transform duration-300 ease-in-out flex flex-col shadow-2xl md:shadow-none">
                    <div class="p-5 flex items-center justify-between border-b border-slate-800">
                        <h1 class="text-2xl font-normal tracking-wider flex items-center gap-2 font-['Demonized']">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 text-orange-500">
                                <path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>
                                <path d="M8 7v10h3a2 2 0 0 0 0-4H8"/>
                                <path d="M8 13h2.5a2 2 0 0 0 0-4H8"/>
                                <path d="M15 9a4 4 0 0 1 0 6"/>
                                <path d="M18 6a8 8 0 0 1 0 12"/>
                            </svg>
                            <span class="text-blue-600">Bayar</span><span class="text-orange-500">Que</span>
                        </h1>
                        <button onclick="toggleMobileMenu()" class="md:hidden text-slate-400 hover:text-white bg-slate-800 p-1.5 rounded-lg"><i data-lucide="x"></i></button>
                    </div>
                    <div class="px-5 py-4 text-xs font-semibold text-slate-400 border-b border-slate-800 bg-slate-900/50 flex flex-col gap-1.5">
                        <span class="uppercase tracking-wider">Login Sebagai:</span>
                        <span class="text-white text-sm font-bold flex items-center gap-2">
                            <i data-lucide="user-check" class="w-4 h-4 text-emerald-400"></i> ${currentUser.name}
                        </span>
                        <span class="text-[10px] text-indigo-400 bg-indigo-400/10 px-2 py-0.5 rounded w-max mt-0.5 border border-indigo-400/20">${userRole.toUpperCase()}</span>
                    </div>

                    <div class="px-5 py-4 border-b border-slate-800 bg-slate-800/30">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Bulan Penagihan Aktif:</label>
                        <div class="flex items-center gap-2 bg-slate-950/50 border border-slate-700/50 rounded-lg px-3 py-2 shadow-inner">
                            <i data-lucide="calendar" class="w-4 h-4 text-indigo-400"></i>
                            <select onchange="changeGlobalMonth(this.value)" class="w-full bg-transparent text-white text-sm outline-none font-medium cursor-pointer appearance-none">
                                ${getMonthOptionsHTML(window.selectedMonth)}
                            </select>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 pointer-events-none"></i>
                        </div>
                    </div>

                    <div class="flex-1 overflow-y-auto py-4 px-3 space-y-1 custom-scrollbar">
                        ${sidebarHTML}
                    </div>
                    <div class="p-4 border-t border-slate-800 bg-slate-900">
                        <button onclick="handleLogout()" class="flex items-center justify-center gap-2 w-full px-4 py-3 text-red-400 hover:bg-red-500/10 hover:text-red-300 rounded-lg transition-colors border border-transparent hover:border-red-500/20 font-bold">

        function getViewDashboard() {
            const monthKey = window.selectedMonth;
            let myCustomers = state.customers;
            let myPayments = state.payments;
            
            // Konversi perbandingan ke String agar terhindar dari bug tipe Number vs String dari DB
            const activeCust = myCustomers.filter(c => String(c.status) === 'Aktif');
            const totalActive = activeCust.length;
            
            let lunasCount15 = 0; let belumCount15 = 0;
            let lunasCount25 = 0; let belumCount25 = 0;
            
            activeCust.forEach(c => {
                const pay = myPayments.find(p => String(p.customerId) === String(c.id) && String(p.month) === String(monthKey));
                const dueStr = String(c.dueDate).trim();
                
                if (dueStr === '15') {
                    if (pay && String(pay.status) === 'Lunas') lunasCount15++; else belumCount15++;
                } else if (dueStr === '25') {
                    if (pay && String(pay.status) === 'Lunas') lunasCount25++; else belumCount25++;
                }
            });

            const revBulanIni = myPayments.filter(p => String(p.status) === 'Lunas' && String(p.month) === String(monthKey))
                                          .reduce((sum, p) => sum + Number(p.amount), 0);
            
            let potensiBulanIni = 0;
            activeCust.forEach(c => {
                const pkg = state.packages.find(pk => String(pk.id) === String(c.packageId));
                let tagihan = pkg ? Number(pkg.price) : 0;
                if (c.customPrice && Number(c.customPrice) > 0) tagihan = Number(c.customPrice);
                potensiBulanIni += tagihan;
            });

            return `
                <div class="space-y-6 max-w-6xl mx-auto">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-800">Dashboard Utama</h2>
                        <p class="text-sm text-slate-500 mt-1">Laporan Ringkasan Bulan: <span class="font-bold text-indigo-600">${formatMonthName(monthKey)}</span></p>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-center">
                            <div class="flex items-center gap-3 mb-2">
                                <div class="p-2.5 rounded-lg bg-indigo-50 text-indigo-600"><i data-lucide="users" class="w-5 h-5"></i></div>
                                <p class="text-sm font-medium text-slate-500">Semua Pelanggan Aktif</p>
                            </div>
                            <p class="text-3xl font-extrabold text-slate-800 pl-1">${totalActive} <span class="text-xs font-semibold text-slate-400">Orang</span></p>
                        </div>
                        
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-purple-200 flex flex-col justify-center bg-gradient-to-br from-white to-purple-50/50">
                            <div class="flex items-center gap-3 mb-2">
                                <div class="p-2.5 rounded-lg bg-purple-100 text-purple-700"><i data-lucide="wallet" class="w-5 h-5"></i></div>
                                <p class="text-sm font-bold text-slate-700">Total Uang Masuk</p>
                            </div>
                            <p class="text-2xl font-extrabold text-purple-800 pl-1 truncate">${formatRp(revBulanIni)}</p>
                            <p class="text-[11px] text-purple-600/80 font-bold pl-1 mt-1 bg-purple-100/50 w-max px-2 py-0.5 rounded">Target: ${formatRp(potensiBulanIni)}</p>
                        </div>

                        <!-- Panel Tanggal 15 -->
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3 relative overflow-hidden">
                            <div class="absolute -right-6 -bottom-6 opacity-5"><i data-lucide="calendar" class="w-32 h-32 text-amber-500"></i></div>
                            <div class="flex items-center justify-between mb-1 relative z-10">
                                <p class="text-xs font-black text-amber-600 uppercase tracking-wider bg-amber-50 px-2 py-1 rounded">Tgl 15</p>
                                <button onclick="setMenu('pay15')" class="text-[10px] font-bold text-slate-400 hover:text-amber-600 transition-colors">Lihat ➔</button>
                            </div>
                            <div class="grid grid-cols-2 gap-2 relative z-10">
                                <div onclick="openModalDashboardDetail('lunas', 15)" class="cursor-pointer bg-emerald-50 hover:bg-emerald-100 transition-colors p-3 rounded-xl border border-emerald-100">
                                    <p class="text-xs font-bold text-emerald-800 flex items-center gap-1 mb-1"><i data-lucide="check-circle" class="w-3 h-3"></i> Lunas</p>
                                    <p class="text-xl font-black text-emerald-700">${lunasCount15}</p>
                                </div>
                                <div onclick="openModalDashboardDetail('nunggak', 15)" class="cursor-pointer bg-red-50 hover:bg-red-100 transition-colors p-3 rounded-xl border border-red-100">
                                    <p class="text-xs font-bold text-red-800 flex items-center gap-1 mb-1"><i data-lucide="alert-circle" class="w-3 h-3"></i> Belum</p>
                                    <p class="text-xl font-black text-red-700">${belumCount15}</p>
                                </div>
                            </div>
                        </div>

                        <!-- Panel Tanggal 25 -->
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3 relative overflow-hidden">
                            <div class="absolute -right-6 -bottom-6 opacity-5"><i data-lucide="calendar" class="w-32 h-32 text-purple-500"></i></div>
                            <div class="flex items-center justify-between mb-1 relative z-10">
                                <p class="text-xs font-black text-purple-600 uppercase tracking-wider bg-purple-50 px-2 py-1 rounded">Tgl 25</p>
                                <button onclick="setMenu('pay25')" class="text-[10px] font-bold text-slate-400 hover:text-purple-600 transition-colors">Lihat ➔</button>
                            </div>
                            <div class="grid grid-cols-2 gap-2 relative z-10">
                                <div onclick="openModalDashboardDetail('lunas', 25)" class="cursor-pointer bg-emerald-50 hover:bg-emerald-100 transition-colors p-3 rounded-xl border border-emerald-100">
                                    <p class="text-xs font-bold text-emerald-800 flex items-center gap-1 mb-1"><i data-lucide="check-circle" class="w-3 h-3"></i> Lunas</p>
                                    <p class="text-xl font-black text-emerald-700">${lunasCount25}</p>
                                </div>
                                <div onclick="openModalDashboardDetail('nunggak', 25)" class="cursor-pointer bg-red-50 hover:bg-red-100 transition-colors p-3 rounded-xl border border-red-100">
                                    <p class="text-xs font-bold text-red-800 flex items-center gap-1 mb-1"><i data-lucide="alert-circle" class="w-3 h-3"></i> Belum</p>

                            </div>
                        </div>

                    </div>
                </div>
            `;
        }

        window.openModalDashboardDetail = function(type, dueFilter = null) {
            const monthKey = window.selectedMonth;
            // Konversi ke string agar aman dari bug type database
            let myCustomers = state.customers.filter(c => String(c.status) === 'Aktif');
            if (dueFilter) {
                myCustomers = myCustomers.filter(c => String(c.dueDate) === String(dueFilter));
            }

            let myPayments = state.payments;

            let titleDue = dueFilter ? ` (Tgl ${dueFilter})` : '';
            let title = type === 'lunas' ? `Sudah Lunas${titleDue}` : `Belum Bayar${titleDue}`;
            let bgColor = type === 'lunas' ? 'bg-emerald-50 border-emerald-100' : 'bg-red-50 border-red-100';
            let textColor = type === 'lunas' ? 'text-emerald-800' : 'text-red-800';
            let icon = type === 'lunas' ? 'check-circle' : 'alert-circle';

            let filtered = myCustomers.filter(c => {
                const pay = myPayments.find(p => String(p.customerId) === String(c.id) && String(p.month) === String(monthKey));
                if (type === 'lunas') return pay && String(pay.status) === 'Lunas';
                return !pay || String(pay.status) !== 'Lunas';
            });

            filtered.sort((a, b) => Number(a.dueDate) - Number(b.dueDate));

            let listHTML = filtered.map((c, i) => {
                const pkg = state.packages.find(pk => String(pk.id) === String(c.packageId));
                let tagihan = pkg ? Number(pkg.price) : 0;
                if (c.customPrice && Number(c.customPrice) > 0) tagihan = Number(c.customPrice);

                return `
                    <div class="flex justify-between items-center py-3 border-b border-slate-100 last:border-0 hover:bg-white p-2 rounded-lg transition-colors">
                        <div>
                            <p class="font-bold text-sm text-slate-800">${i+1}. ${c.name}</p>
                            <p class="text-xs text-slate-500 flex items-center gap-1 mt-0.5"><i data-lucide="phone" class="w-3 h-3"></i> ${c.phone}</p>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-sm text-slate-800">${formatRp(tagihan)}</p>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600">Jatuh Tempo: Tgl ${c.dueDate}</span>
                        </div>
                    </div>
                `;
            }).join('');

            if(listHTML === '') listHTML = `<div class="p-6 text-center text-slate-500 font-medium">Tidak ada data di kategori ini.</div>`;

            const html = `
                <div class="fixed inset-0 bg-slate-900/60 z-50 flex justify-center items-center p-4 backdrop-blur-sm">
                    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden fade-in flex flex-col max-h-[85vh]">
                        <div class="p-5 border-b flex justify-between items-center ${bgColor}">
                            <h3 class="text-lg font-bold ${textColor} flex items-center gap-2"><i data-lucide="${icon}" class="w-5 h-5"></i> ${title}</h3>
                            <button onclick="closeModal()" class="text-slate-500 hover:text-slate-800 bg-white p-1.5 rounded-full shadow-sm"><i data-lucide="x" class="w-4 h-4"></i></button>
                        </div>
                        <div class="p-2 bg-slate-50 border-b border-slate-100 text-center">
                            <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Total: ${filtered.length} Pelanggan</span>
                        </div>
                        <div class="overflow-y-auto p-4 bg-slate-50/50 custom-scrollbar">
                            ${listHTML}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-root').innerHTML = html;
            lucide.createIcons();
        };

        window.filterCustomerPay = '';
        window.changeCustomerFilter = function() {
            window.filterCustomerPay = document.getElementById('cust-pay-filter').value;
            renderMenuContent();
        };

        window.handleSearchCustomer = function(val) {
            window.searchCustomer = val;
            renderMenuContent();
            setTimeout(() => {
                const el = document.getElementById('search-customer');
                if(el) { el.focus(); el.setSelectionRange(val.length, val.length); }
            }, 10);
        }

        function getViewCustomers() {
            const monthKey = window.selectedMonth;

            const d = new Date(monthKey + "-01");
            const m0 = d.toISOString().slice(0, 7); 
            d.setMonth(d.getMonth() - 1); const m1 = d.toISOString().slice(0, 7); 
            d.setMonth(d.getMonth() - 1); const m2 = d.toISOString().slice(0, 7); 
            const last3Months = [m0, m1, m2];

            let filteredCust = state.customers;

            if (window.searchCustomer) {
                const q = String(window.searchCustomer).toLowerCase();
                filteredCust = filteredCust.filter(c => 
                    String(c.name).toLowerCase().includes(q) || 
                    String(c.phone).toLowerCase().includes(q) ||
                    String(c.address || '').toLowerCase().includes(q)
                );
            }
            
            if (window.filterCustomerPay === 'lunas') {
                filteredCust = filteredCust.filter(c => {
                    const pay = state.payments.find(p => String(p.customerId) === String(c.id) && String(p.month) === String(monthKey));
                    return pay && String(pay.status) === 'Lunas';
                });
            } else if (window.filterCustomerPay === 'belum') {
                filteredCust = filteredCust.filter(c => {
                    const pay = state.payments.find(p => String(p.customerId) === String(c.id) && String(p.month) === String(monthKey));
                    return !pay || String(pay.status) !== 'Lunas';
                });
            } else if (window.filterCustomerPay === 'nunggak') {
                filteredCust = filteredCust.filter(c => {
                    let nunggakCount = 0;
                    last3Months.forEach(m => {
                        const pay = state.payments.find(p => String(p.customerId) === String(c.id) && String(p.month) === String(m));
                        if (!pay || String(pay.status) !== 'Lunas') nunggakCount++;
                    });
                    return nunggakCount >= 1 && nunggakCount <= 3;
                });
            }

            let trs = filteredCust.map(c => {
                const pkg = state.packages.find(p => String(p.id) === String(c.packageId));
                const pkgDisplay = pkg ? pkg.name : '-';
                
                let tagihan = pkg ? pkg.price : 0;
                if (c.customPrice && Number(c.customPrice) > 0) tagihan = Number(c.customPrice);
                
                const pay = state.payments.find(p => String(p.customerId) === String(c.id) && String(p.month) === String(monthKey));
                
                let payBadge = `<span class="px-2.5 py-1 bg-slate-100 text-slate-600 rounded-full text-xs font-bold">Belum Ditagih</span>`;
                let payNote = `<div class="text-[11px] text-slate-400 mt-1.5 font-bold">Jatuh Tempo: Tgl ${c.dueDate}</div>`;
                
                let countTunggakan = 0;
                last3Months.forEach(m => {
                    const pastPay = state.payments.find(p => String(p.customerId) === String(c.id) && String(p.month) === String(m));
                    if (!pastPay || String(pastPay.status) !== 'Lunas') countTunggakan++;
                });

                if(pay) {
                    if(String(pay.status) === 'Lunas') {
                        payBadge = `<span class="px-2.5 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full text-xs font-bold"><i data-lucide="check" class="w-3 h-3 inline"></i> Lunas</span>`;
                        payNote = `<div class="text-[11px] text-emerald-600 mt-1.5 font-bold">Via ${pay.method} (${pay.date})</div>`;
                    } else {
                        payBadge = `<span class="px-2.5 py-1 bg-red-50 text-red-700 border border-red-200 rounded-full text-xs font-bold"><i data-lucide="x" class="w-3 h-3 inline"></i> Belum Bayar</span>`;
                        payNote = `<div class="text-[11px] text-red-500 mt-1.5 font-bold truncate max-w-[150px]" title="${pay.reason}">Ket: ${pay.reason || '-'}</div>`;
                    }
                }
                
                if (!pay || String(pay.status) !== 'Lunas') {
                    if (countTunggakan > 0) {
                        payBadge += ` <span class="ml-1 px-1.5 py-0.5 bg-red-100 text-red-700 rounded text-[10px] font-black border border-red-200" title="Nunggak ${countTunggakan} bln">${countTunggakan} Bln</span>`;
                    }
                }

                return `
                    <tr class="hover:bg-slate-50/80 border-b border-slate-100 last:border-0 transition-colors">
                        <td class="p-4 align-top">
                            <div class="font-bold text-slate-800 text-sm md:text-base">${c.name} <span class="${String(c.status)==='Non-Aktif'?'bg-red-100 text-red-600 px-2 py-0.5 rounded text-[10px] ml-1 font-black':'hidden'}">NON-AKTIF</span></div>
                        </td>
                        <td class="p-4 align-top text-xs md:text-sm text-slate-600 whitespace-normal min-w-[150px] leading-relaxed">${c.address || '-'}</td>
                        <td class="p-4 align-top text-slate-700 font-medium text-sm">${c.phone}</td>
                        <td class="p-4 align-top">
                            <div class="text-slate-600 text-xs md:text-sm font-bold bg-slate-100 px-2 py-1 rounded w-max">${pkgDisplay}</div>
                            <div class="text-sm font-black text-blue-600 mt-1.5">${formatRp(tagihan)} ${c.customPrice ? '<span class="text-amber-600 text-[10px] uppercase ml-1">(Khusus)</span>' : ''}</div>
                        </td>
                        <td class="p-4 align-top">
                            <div class="flex items-center">${payBadge}</div>
                            ${payNote}
                        </td>
                        <td class="p-4 align-top">
                            <div class="flex gap-2">
                                <button onclick="openModalCustomPrice('${c.id}')" class="text-amber-600 bg-amber-50 hover:bg-amber-100 p-2.5 rounded-lg transition-colors border border-amber-200 flex items-center justify-center shadow-sm" title="Ubah Nominal Khusus">
                                    <i data-lucide="dollar-sign" class="w-4 h-4"></i>

            if(!data.packageId) { showToast("Gagal Menyimpan", "Paket Internet wajib dipilih!", "error"); return; }

            if (id) {
                const idx = state.customers.findIndex(c => String(c.id) === String(id));

        window.exportCustomersCSV = function() {
            const monthKey = window.selectedMonth;
            const headers = ['ID', 'Nama', 'Alamat', 'No. HP', 'Paket', 'Nominal Tagihan', 'Tgl Jatuh Tempo', 'Status Berlangganan', 'Status Pembayaran Bulan Ini'];
            
            const rows = state.customers.map(c => {
                const pkg = state.packages.find(p => String(p.id) === String(c.packageId));
                const pkgName = pkg ? pkg.name : '-';
                let tagihan = pkg ? pkg.price : 0;
                if (c.customPrice && Number(c.customPrice) > 0) tagihan = Number(c.customPrice);

                const pay = state.payments.find(p => String(p.customerId) === String(c.id) && String(p.month) === String(monthKey));
                let payStat = 'Belum Ditagih';
                if(pay) payStat = pay.status === 'Lunas' ? `Lunas (${pay.method})` : `Belum Bayar (${pay.reason})`;

                return `"${c.id}";"${c.name}";"${c.address || ''}";"${c.phone}";"${pkgName}";"${tagihan}";"${c.dueDate}";"${c.status}";"${payStat}"`;
            });
            const csvContent = "\uFEFF" + [headers.join(';'), ...rows].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.setAttribute("href", URL.createObjectURL(blob));
            link.setAttribute("download", `Data_Pelanggan_${monthKey}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

                ['Siti Aminah', 'Perumahan Asri Blok C2', '089876543210']
            ];
            let csvContent = "\uFEFF" + headers.join(';') + '\n' + rows.map(e => e.join(';')).join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.setAttribute("href", URL.createObjectURL(blob));
            link.setAttribute("download", "Template_Simple_Pelanggan.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

            const pkgId = document.getElementById('csv-pkg').value;
            const due = document.getElementById('csv-due').value;
            const status = document.getElementById('csv-status').value;
            const fileInput = document.getElementById('csv-file');

            let errors = [];
            if (!pkgId) errors.push("- Paket Internet belum dipilih!");
            if (!fileInput.files.length) errors.push("- Anda belum memasukkan file CSV!");

            if (errors.length > 0) { showToast("Import Gagal", "Paket Internet dan File CSV wajib diisi!", "error"); return; }

            const file = fileInput.files[0];
            const reader = new FileReader();
            
            reader.onload = async function(e) {
                const text = e.target.result;
                const rows = text.split('\n');
                if (rows.length < 2) { showToast("Import Gagal", "File CSV kosong atau format salah!", "error"); return; }

                const header = rows[0].toLowerCase();
                const separator = header.includes(';') ? ';' : ',';
                const headers = header.split(separator).map(h => h.replace(/['"]+/g, '').trim());

                let idxName = headers.findIndex(h => h.includes('nama'));
                let idxPhone = headers.findIndex(h => h.includes('hp') || h.includes('phone') || h.includes('telepon'));
                let idxAddr = headers.findIndex(h => h.includes('alamat') || h.includes('address'));

                if (idxName === -1) idxName = 0; 
                if (idxAddr === -1 && headers.length >= 2) idxAddr = 1; 
                if (idxPhone === -1 && headers.length >= 3) idxPhone = 2; 

                let successCount = 0;
                for (let i = 1; i < rows.length; i++) {
                    const line = rows[i].trim();
                    if (!line) continue;
                    const cols = line.split(separator).map(c => c.replace(/['"]+/g, '').trim());
                    if (cols.length < 2 || !cols[idxName]) continue;

                    state.customers.push({
                        id: generateId(), 
                        name: cols[idxName], 
                        address: (idxAddr !== -1 && cols[idxAddr]) ? cols[idxAddr] : '-', 
                        phone: (idxPhone !== -1 && cols[idxPhone]) ? cols[idxPhone] : '-',
                        packageId: pkgId, 
                        dueDate: due, 
                        status: status, 
                        customPrice: ''
                    });
                    successCount++;
                }

                closeModal();
                renderMenuContent();
                showToast("Import Sukses", `Berhasil memasukkan ${successCount} data pelanggan.`, "success");
                await syncToDatabase("Menyimpan Data Import...");
            };
            reader.readAsText(file);
        }

                                        <option value="Lunas" ${String(pay.status)==='Lunas'?'selected':''}>✅ Sudah Lunas (Bayar)</option>
                                        <option value="Belum Bayar" ${String(pay.status)==='Belum Bayar'?'selected':''}>❌ Belum Bayar (Nunggak)</option>
                                    </select>
                                </div>
                                
                                <div id="fields-lunas" class="space-y-4 ${String(pay.status)==='Lunas'?'block':'hidden'} bg-emerald-50/50 p-4 rounded-xl border border-emerald-100">
                                    <div>
                                        <label class="block text-sm font-bold text-slate-700 mb-1.5">Metode Pembayaran</label>
                                        <select id="pay-method" class="w-full px-4 py-3 border border-emerald-200 rounded-xl outline-none focus:border-emerald-500 bg-white font-bold cursor-pointer shadow-sm">
                                            <option value="Cash" ${pay.method==='Cash'?'selected':''}>💵 Cash (Tunai)</option>
                                            <option value="Transfer" ${pay.method==='Transfer'?'selected':''}>💳 Transfer Bank</option>
                                            <option value="Datang Ke Kantor" ${pay.method==='Datang Ke Kantor'?'selected':''}>🏢 Datang Ke Kantor</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-bold text-slate-700 mb-1.5">Tanggal Bayar</label>
                                        <input type="date" id="pay-date" value="${pay.date}" class="w-full px-4 py-3 border border-emerald-200 rounded-xl outline-none focus:border-emerald-500 bg-white font-bold shadow-sm">
                                    </div>
                                </div>
                                
                                <div id="fields-nunggak" class="space-y-4 ${String(pay.status)==='Belum Bayar'?'block':'hidden'} bg-red-50/50 p-4 rounded-xl border border-red-100">
                                    <div>
                                        <label class="block text-sm font-bold text-slate-700 mb-1.5">Alasan Nunggak / Keterangan</label>
                                        <input type="text" id="pay-reason" value="${pay.reason}" placeholder="Cth: Orang tidak ada di rumah" class="w-full px-4 py-3 border border-red-200 rounded-xl outline-none focus:border-red-500 bg-white font-bold shadow-sm">
                                    </div>
                                </div>

                                <div class="pt-4 flex justify-end gap-3 border-t border-slate-100">
                                    <button type="submit" class="w-full px-5 py-3.5 text-sm font-bold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 shadow-md flex items-center justify-center gap-2 transition-colors"><i data-lucide="check-circle" class="w-5 h-5"></i> Simpan Status Tagihan</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-root').innerHTML = html;
            lucide.createIcons();
        }

        window.togglePaymentFields = function(val) {
            const lunas = document.getElementById('fields-lunas');
            const nunggak = document.getElementById('fields-nunggak');
            if(val === 'Lunas') {
                lunas.classList.remove('hidden'); lunas.classList.add('block');
                nunggak.classList.remove('block'); nunggak.classList.add('hidden');
            } else {
                nunggak.classList.remove('hidden'); nunggak.classList.add('block');
                lunas.classList.remove('block'); lunas.classList.add('hidden');
            }
        }

        window.savePayment = async function(e, custId, amount) {
            e.preventDefault();
            const status = document.getElementById('pay-status').value;
            const data = {
                id: generateId(), 
                customerId: String(custId), 
                month: window.selectedMonth, 
                status: status,
                amount: status === 'Lunas' ? amount : 0, 
                method: status === 'Lunas' ? document.getElementById('pay-method').value : '',
                date: status === 'Lunas' ? document.getElementById('pay-date').value : '', 
                reason: status === 'Belum Bayar' ? document.getElementById('pay-reason').value : '',
                technicianId: currentUser.id 
            };
            
            const idx = state.payments.findIndex(p => String(p.customerId) === String(custId) && String(p.month) === String(window.selectedMonth));
            if (idx >= 0) state.payments[idx] = data;
            else state.payments.push(data);
            
            closeModal();
            renderMenuContent();
            await syncToDatabase("Menyimpan Tagihan...");
            
            setTimeout(() => {
                showToast("Pembayaran Sukses", "Data tagihan telah disimpan ke dalam database.", "success");
            }, 300);
        }

        function getViewReports() {
            const monthKey = window.selectedMonth;
            const allLunas = state.payments.filter(p => String(p.month) === String(monthKey) && String(p.status) === 'Lunas');
            
            let reportData = [];
            if (userRole === 'admin') {
                reportData = state.technicians.map(t => {
                    const techPayments = allLunas.filter(p => String(p.technicianId) === String(t.id));
                    const rev = techPayments.reduce((sum, p) => sum + Number(p.amount), 0);
                    return { name: t.name, revenue: rev, trxCount: techPayments.length };
                });
            } else {
                const techPayments = allLunas.filter(p => String(p.technicianId) === String(currentUser.id));
                const rev = techPayments.reduce((sum, p) => sum + Number(p.amount), 0);
                reportData = [{ name: currentUser.name, revenue: rev, trxCount: techPayments.length }];
            }

            let totalOmset = reportData.reduce((sum, r) => sum + r.revenue, 0);

            let cards = reportData.map(r => `
                <div class="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm hover:shadow-md transition-shadow relative overflow-hidden group">
                    <div class="absolute -right-4 -bottom-4 opacity-5 group-hover:scale-110 transition-transform"><i data-lucide="receipt" class="w-32 h-32 text-blue-600"></i></div>
                    <div class="flex items-center gap-4 mb-5 relative z-10">
                        <div class="w-14 h-14 rounded-2xl bg-blue-50 flex items-center justify-center text-blue-700 font-black text-xl border border-blue-200 shadow-sm">${r.name.charAt(0)}</div>
                        <div>
                            <p class="font-black text-slate-800 text-lg">${r.name}</p>
                            <p class="text-xs text-slate-500 font-bold bg-slate-100 px-2.5 py-1 rounded-md w-max mt-1.5 border border-slate-200 shadow-inner">${r.trxCount} Pembayaran Diterima</p>
                        </div>
                    </div>
                    <div class="pt-5 border-t border-slate-100 relative z-10">
                        <p class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-1">Setoran Terkumpul</p>
                        <p class="text-2xl font-black text-blue-700">${formatRp(r.revenue)}</p>
                    </div>
                </div>
            `).join('');

            if(cards === '') cards = `<div class="col-span-full p-8 text-center text-slate-500 font-medium">Belum ada data laporan bulan ini.</div>`;

            let techOptions = '';
            if (userRole === 'admin') {
                techOptions = state.technicians.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
                techOptions = `<option value="all">Semua Teknisi</option>` + techOptions;
            } else {
                techOptions = `<option value="${currentUser.id}">${currentUser.name}</option>`;
            }

            return `
                <div class="space-y-6 max-w-5xl mx-auto">
                    <div class="flex flex-col gap-1">
                        <h2 class="text-2xl font-extrabold text-slate-800 flex items-center gap-2"><i data-lucide="file-text" class="w-6 h-6 text-blue-600"></i> Laporan Keuangan</h2>
                        <p class="text-sm text-slate-500">Periode laporan: <span class="font-bold text-blue-600">${formatMonthName(monthKey)}</span></p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${cards}
                    </div>

                    <div class="bg-gradient-to-r from-blue-700 to-blue-600 p-8 rounded-2xl text-white shadow-xl flex flex-col md:flex-row items-center justify-between gap-6 border border-blue-800 relative overflow-hidden mt-4">
                        <div class="absolute -left-10 -bottom-10 opacity-10"><i data-lucide="banknote" class="w-64 h-64 text-white"></i></div>
                        <div class="relative z-10 flex items-center gap-4">
                            <div class="bg-white/10 p-3 rounded-2xl backdrop-blur-sm border border-white/20"><i data-lucide="wallet" class="w-8 h-8 text-white"></i></div>
                            <div>
                                <h3 class="text-lg font-bold text-blue-100">Total Omset ${userRole === 'admin' ? 'Keseluruhan' : 'Anda'}</h3>
                                <p class="text-sm text-blue-200">Uang masuk yang berhasil ditagih bulan ini</p>
                            </div>
                        </div>
                        <p class="text-4xl md:text-5xl font-black relative z-10 drop-shadow-md">${formatRp(totalOmset)}</p>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mt-6 fade-in">
                        <h3 class="text-lg font-extrabold text-slate-800 mb-4 flex items-center gap-2"><i data-lucide="printer" class="w-5 h-5 text-blue-600"></i> Cetak / Download Laporan PDF</h3>
                        <p class="text-sm text-slate-500 mb-4">Pilih teknisi untuk mencetak laporan daftar tagihan klien (Lunas & Belum Bayar) sesuai penagih.</p>
                        
                        <div class="flex flex-col md:flex-row gap-4 items-center">
                            <div class="w-full md:w-1/2">
                                <select id="report-tech-select" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 focus:bg-white font-bold cursor-pointer transition-colors">
                                    ${techOptions}
                                </select>
                            </div>
                            <div class="w-full md:w-1/2 flex gap-3">
                                <button onclick="generateReportPDF()" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white px-4 py-3 rounded-xl flex items-center justify-center gap-2 text-sm font-bold transition-colors shadow-sm">
                                    <i data-lucide="file-down" class="w-4 h-4"></i> Download PDF
                                </button>
                                <button onclick="printReport()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-4 py-3 rounded-xl flex items-center justify-center gap-2 text-sm font-bold transition-colors shadow-sm">
                                    <i data-lucide="printer" class="w-4 h-4"></i> Cetak Langsung
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function getViewSettings() {
            if(userRole !== 'admin') return `<div class="p-8 text-center text-red-500 font-bold">Akses Ditolak.</div>`;
            return `
                <div class="space-y-6 max-w-2xl mx-auto">
                    <div>
                        <h2 class="text-2xl font-extrabold text-slate-800 flex items-center gap-2"><i data-lucide="settings" class="w-6 h-6 text-blue-600"></i> Pengaturan Sistem</h2>
                        <p class="text-sm text-slate-500 mt-1">Atur koneksi Google Sheets dan ubah kata sandi admin.</p>
                    </div>

                    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                        <h3 class="font-extrabold text-slate-800 mb-6 flex items-center gap-2 border-b border-slate-100 pb-3"><i data-lucide="database" class="w-5 h-5 text-emerald-500"></i> Koneksi Google Sheets (Database)</h3>
                        <div class="mb-8 space-y-4">
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1.5">URL Web App (Google Apps Script)</label>
                                ${DATABASE_URL ? 
                                    `<div class="w-full px-4 py-3 border-2 border-emerald-200 bg-emerald-50 rounded-xl font-medium text-emerald-700 break-all"><i data-lucide="lock" class="w-4 h-4 inline mb-0.5"></i> URL Database telah dikunci secara permanen di dalam sistem aplikasi. Anda siap menggunakannya!</div>` :
                                    `<input type="text" id="set-url" value="${localStorage.getItem('bayarque_script_url') || ''}" placeholder="https://script.google.com/macros/s/..." class="w-full px-4 py-3 border-2 border-slate-200 rounded-xl outline-none focus:border-emerald-500 bg-slate-50 focus:bg-white font-medium transition-colors">
                                     <p class="text-xs text-slate-500 mt-2 font-medium">Masukkan link hasil <span class="font-bold">Deploy as Web App</span> dari <i>Code.gs</i> Anda. Pastikan akses di-set ke <span class="font-bold text-emerald-600">"Anyone"</span>.</p>`
                                }
                            </div>
                        </div>
                    
                        <h3 class="font-extrabold text-slate-800 mb-6 flex items-center gap-2 border-b border-slate-100 pb-3"><i data-lucide="shield" class="w-5 h-5 text-slate-500"></i> Keamanan Akun Admin</h3>
                        <form onsubmit="saveSettings(event)" class="space-y-5">
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1.5">Username Admin</label>
                                <input type="text" id="set-user" required value="${state.admin.user}" class="w-full px-4 py-3 border-2 border-slate-200 rounded-xl outline-none focus:border-blue-500 bg-slate-50 focus:bg-white font-bold transition-colors">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1.5">Password Admin</label>
                                <input type="text" id="set-pass" required value="${state.admin.pass}" class="w-full px-4 py-3 border-2 border-slate-200 rounded-xl outline-none focus:border-blue-500 bg-slate-50 focus:bg-white font-bold transition-colors">
                            </div>
                            <div class="pt-4 mt-2 border-t border-slate-100">
                                <button type="submit" class="w-full mt-4 px-5 py-3.5 text-sm font-bold text-white bg-blue-600 rounded-xl hover:bg-blue-700 shadow-md flex items-center justify-center gap-2 transition-colors"><i data-lucide="save" class="w-4 h-4"></i> Simpan Semua Pengaturan</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        window.saveSettings = async function(e) {
            e.preventDefault();
            
            let url = DATABASE_URL;
            let prevUrl = localStorage.getItem('bayarque_script_url');
            
            if (!DATABASE_URL) {
                url = document.getElementById('set-url').value.trim();
                localStorage.setItem('bayarque_script_url', url);
            }
            
            state.admin.user = document.getElementById('set-user').value;
            state.admin.pass = document.getElementById('set-pass').value;
            
            showToast("Berhasil Disimpan", "Pengaturan sistem berhasil diperbarui.", "success");
            
            if(url && url !== prevUrl) {
                window.location.reload();
            } else {
                await syncToDatabase("Menyimpan Pengaturan...");
            }
        }

        window.getReportHTMLData = function(techId) {
            const monthKey = window.selectedMonth;
            let activeCustomers = state.customers.filter(c => String(c.status) === 'Aktif');
            let payments = state.payments.filter(p => String(p.month) === String(monthKey));

            let techName = "Semua Teknisi";
            if (techId !== 'all') {
                const tech = state.technicians.find(t => String(t.id) === String(techId));
                if (tech) techName = tech.name;
            } else if (userRole !== 'admin') {
                techName = currentUser.name;
                techId = currentUser.id;
            }

            let reportRows = '';
            let totalLunas = 0;
            let countLunas = 0;
            let countBelum = 0;

            activeCustomers.forEach((c, idx) => {
                const pkg = state.packages.find(pk => String(pk.id) === String(c.packageId));
                let tagihan = pkg ? Number(pkg.price) : 0;
                if (c.customPrice && Number(c.customPrice) > 0) tagihan = Number(c.customPrice);

                const pay = payments.find(p => String(p.customerId) === String(c.id));
                
                if (techId !== 'all') {
                    if (pay && String(pay.technicianId) !== String(techId)) return;
                    if (!pay && userRole === 'admin') return; 
                }

                let statusText = 'Belum Ditagih';
                if (pay) {
                    if (String(pay.status) === 'Lunas') {
                        statusText = 'Lunas';
                        totalLunas += tagihan;
                        countLunas++;
                    } else {
                        statusText = 'Belum Bayar';
                        countBelum++;
                    }
                } else {
                    countBelum++;
                }

                reportRows += `
                    <tr>
                        <td style="padding: 10px; border: 1px solid #ddd;">${idx + 1}</td>
                        <td style="padding: 10px; border: 1px solid #ddd;">${c.name}</td>
                        <td style="padding: 10px; border: 1px solid #ddd;">${c.phone}</td>
                        <td style="padding: 10px; border: 1px solid #ddd; font-weight: bold;">${formatRp(tagihan)}</td>
                        <td style="padding: 10px; border: 1px solid #ddd;"><strong>${statusText}</strong></td>
                    </tr>
                `;
            });

            if (reportRows === '') {
                reportRows = `<tr><td colspan="5" style="padding: 15px; text-align: center; border: 1px solid #ddd; color: #666;">Tidak ada data tagihan untuk teknisi ini.</td></tr>`;
            }

            return `
                <div id="print-area" style="padding: 30px; font-family: 'Inter', sans-serif; color: #333; background: #fff; max-width: 1000px; margin: 0 auto;">
                    <div style="text-align: center; border-bottom: 3px solid #2563eb; padding-bottom: 20px; margin-bottom: 25px;">
                        <h1 style="margin: 0; color: #1e40af; font-size: 26px; font-weight: 800; text-transform: uppercase;">Laporan Tagihan Pelanggan</h1>
                        <p style="margin: 8px 0 0 0; color: #475569; font-size: 16px;">Bulan Penagihan: <strong style="color: #0f172a;">${formatMonthName(monthKey)}</strong></p>
                        <p style="margin: 5px 0 0 0; color: #475569; font-size: 16px;">Teknisi / Penagih: <strong style="color: #0f172a;">${techName}</strong></p>
                    </div>
                    
                    <div style="margin-top: 20px; margin-bottom: 20px;">
                        <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;">
                            <thead>
                                <tr style="background-color: #f8fafc; color: #334155;">
                                    <th style="padding: 12px 10px; border: 1px solid #cbd5e1; width: 5%;">No</th>
                                    <th style="padding: 12px 10px; border: 1px solid #cbd5e1; width: 35%;">Nama Pelanggan</th>
                                    <th style="padding: 12px 10px; border: 1px solid #cbd5e1; width: 25%;">No HP</th>
                                    <th style="padding: 12px 10px; border: 1px solid #cbd5e1; width: 20%;">Nominal Tagihan</th>
                                    <th style="padding: 12px 10px; border: 1px solid #cbd5e1; width: 15%;">Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${reportRows}
                            </tbody>
                        </table>
                    </div>

                    <div style="margin-top: 30px; border-top: 2px dashed #cbd5e1; padding-top: 20px; display: flex; justify-content: flex-end;">
                        <div style="width: 350px; background-color: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0;">
                            <p style="display: flex; justify-content: space-between; margin: 8px 0; font-size: 14px; color: #475569;"><span>Total Lunas:</span> <strong style="color: #10b981;">${countLunas} Pelanggan</strong></p>
                            <p style="display: flex; justify-content: space-between; margin: 8px 0; font-size: 14px; color: #475569;"><span>Total Belum Bayar:</span> <strong style="color: #ef4444;">${countBelum} Pelanggan</strong></p>
                            <div style="border-bottom: 1px solid #cbd5e1; margin: 15px 0;"></div>
                            <p style="display: flex; justify-content: space-between; margin: 5px 0; font-size: 18px; font-weight: 900; color: #0f172a;"><span>Total Pemasukan:</span> <span style="color: #2563eb;">${formatRp(totalLunas)}</span></p>
                        </div>
                    </div>
                </div>
            `;
        };

        window.generateReportPDF = function() {
            showLoading("Membuat PDF...");
            const techId = document.getElementById('report-tech-select').value;
            const htmlContent = getReportHTMLData(techId);
            
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = htmlContent;
            document.body.appendChild(tempDiv);
            
            const opt = {
                margin:       10,
                filename:     `Laporan_Tagihan_${window.selectedMonth}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(tempDiv.firstElementChild).save().then(() => {
                document.body.removeChild(tempDiv);
                hideLoading();
            });
        };

        window.printReport = function() {
            const techId = document.getElementById('report-tech-select').value;
            const htmlContent = getReportHTMLData(techId);
            
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                    <head>
                        <title>Cetak Laporan - BayarQue</title>
                        <style>
                            body { font-family: sans-serif; margin: 0; padding: 0; }
                            table { page-break-inside: auto; }
                            tr { page-break-inside: avoid; page-break-after: auto; }
                            thead { display: table-header-group; }
                            tfoot { display: table-footer-group; }
                            @media print {
                                @page { margin: 1cm; }
                                body { -webkit-print-color-adjust: exact; }
                            }
                        </style>
                    </head>
                    <body>
                        ${htmlContent}
                        <script>
                            window.onload = function() {
                                window.print();
                                setTimeout(function(){ window.close(); }, 500);
                            }
                        <\/script>
                    </body>
                </html>
            `);
            printWindow.document.close();
        };

    </script>
</body>
</html>
