<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BayarQue - Billing Internet</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- html2pdf Bundle CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .fade-in { animation: fadeIn 0.25s ease-in-out; }
        .slide-up { animation: slideUp 0.25s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        input[type="month"]::-webkit-calendar-picker-indicator,
        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(0.6);
            cursor: pointer;
        }

        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased overflow-hidden select-none">

    <!-- Container Utama Aplikasi -->
    <div id="app" class="h-screen w-screen flex flex-col md:flex-row overflow-hidden">
        <div class="flex flex-col items-center justify-center w-full h-full space-y-4">
            <i data-lucide="loader-2" class="animate-spin text-blue-600 w-12 h-12"></i>
            <p class="text-slate-500 font-bold text-sm tracking-wide">Menyiapkan BayarQue...</p>
        </div>
    </div>

    <!-- Overlay Loading Transparan -->
    <div id="loading-overlay" class="fixed inset-0 bg-slate-900/60 z-[70] flex-col items-center justify-center hidden backdrop-blur-sm transition-opacity">
        <i data-lucide="loader-2" class="animate-spin text-white w-12 h-12 mb-3"></i>
        <p id="loading-text" class="text-white font-extrabold text-base tracking-wide">Memproses data...</p>
    </div>

    <!-- Container Notifikasi Toast -->
    <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-3 pointer-events-none *:pointer-events-auto"></div>

    <!-- Root untuk Modal Dialog -->
    <div id="modal-root"></div>

    <script>
        const DATABASE_URL = "https://script.google.com/macros/s/AKfycbyjdyvM5Fu_Nm55WW74zaYF2ckpSQmCGZVAUHwF-5JZNlIZtb7Fybp6Y27cDe12pxIK-w/exec"; 

        let state = {
            packages: [],
            technicians: [],
            customers: [],
            payments: [],
            admin: { user: 'admin', pass: 'admin123' }
        };

        let currentUser = null; 
        let userRole = null; 
        let currentMenu = 'dashboard';
        let isMobileMenuOpen = false;
        let isDesktopSidebarOpen = true;

        window.selectedMonth = new Date().toISOString().slice(0, 7); 

        window.showToast = function(title, message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            
            const toastId = 'toast_' + Math.random().toString(36).substr(2, 9);
            let bgColor = 'bg-emerald-600';
            let icon = 'check-circle';
            
            if (type === 'error') { bgColor = 'bg-rose-600'; icon = 'alert-circle'; }
            else if (type === 'warning') { bgColor = 'bg-amber-600'; icon = 'alert-triangle'; }
            else if (type === 'info') { bgColor = 'bg-blue-600'; icon = 'info'; }
            
            const toastHTML = `
                <div id="${toastId}" class="flex items-start gap-3 p-4 ${bgColor} text-white rounded-2xl shadow-xl transform transition-all duration-300 translate-x-full opacity-0 max-w-sm border border-white/20">
                    <i data-lucide="${icon}" class="w-5 h-5 flex-shrink-0 drop-shadow-sm mt-0.5"></i>
                    <div class="flex-1">
                        <h4 class="font-extrabold text-sm tracking-wide leading-tight">${title}</h4>
                        <p class="text-xs text-white/90 mt-1 leading-relaxed font-medium">${message}</p>
                    </div>
                    <button onclick="document.getElementById('${toastId}').remove()" class="text-white/70 hover:text-white transition-colors bg-black/15 p-1 rounded-lg">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            `;
            
            container.insertAdjacentHTML('beforeend', toastHTML);
            if (window.lucide) lucide.createIcons();
            
            const toastEl = document.getElementById(toastId);
            requestAnimationFrame(() => {
                if (toastEl) {
                    toastEl.classList.remove('translate-x-full', 'opacity-0');
                    toastEl.classList.add('translate-x-0', 'opacity-100');
                }
            });
            
            setTimeout(() => {
                if(document.getElementById(toastId)) {
                    toastEl.classList.remove('translate-x-0', 'opacity-100');
                    toastEl.classList.add('translate-x-full', 'opacity-0');
                    setTimeout(() => { toastEl.remove(); }, 300); 
                }
            }, 3500);
        };

        function saveCacheToLocalStorage() {
            try {
                localStorage.setItem('bayarque_local_cache', JSON.stringify({
                    packages: state.packages,
                    technicians: state.technicians,
                    customers: state.customers,
                    payments: state.payments,
                    admin: state.admin
                }));
            } catch(e) {}
        }

        function loadCacheFromLocalStorage() {
            try {
                const raw = localStorage.getItem('bayarque_local_cache');
                if (!raw) return false;
                const parsed = JSON.parse(raw);
                if (parsed.packages) state.packages = parsed.packages;
                if (parsed.technicians) state.technicians = parsed.technicians;
                if (parsed.customers) state.customers = parsed.customers;
                if (parsed.payments) state.payments = parsed.payments;
                if (parsed.admin) state.admin = parsed.admin;
                return true;
            } catch(e) {
                return false;
            }
        }

        async function syncToDatabase(loadingMessage = "Menyimpan ke Google Sheets...") {
            const url = DATABASE_URL || localStorage.getItem('bayarque_script_url');
            saveCacheToLocalStorage();
            if (!url) return;
            
            showLoading(loadingMessage);
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    redirect: 'follow',
                    body: JSON.stringify(state)
                });
                try {
                    const result = await response.json();
                    if(result.status !== 'success' && result.error) console.warn("Peringatan server:", result.error);
                } catch(e) {}
            } catch (error) {
                console.error("Gagal sinkron:", error);
                showToast("Koneksi Offline", "Data tersimpan di perangkat lokal. Akan disinkronkan saat online.", "warning");
            }
            hideLoading();
        }

        async function loadFromGoogleSheets(url, isManual = false) {
            const syncIcon = document.getElementById('icon-sync-global');
            if (syncIcon) syncIcon.classList.add('animate-spin');

            try {
                const cacheBuster = new Date().getTime();
                const fetchUrl = url + (url.includes('?') ? '&' : '?') + 'nocache=' + cacheBuster;
                
                const response = await fetch(fetchUrl);
                const data = await response.json();
                
                if (data.packages) state.packages = data.packages;
                if (data.technicians) state.technicians = data.technicians;
                
                if (data.customers) {
                    state.customers = data.customers.map(c => ({
                        ...c,
                        id: String(c.id).trim(),
                        packageId: String(c.packageId).trim()
                    }));
                }
                
                if (data.payments) {
                    state.payments = data.payments.map(p => {
                        let parsedMonth = String(p.month).trim();
                        if (parsedMonth.includes('T')) {
                            const d = new Date(parsedMonth);
                            if (!isNaN(d.getTime())) {
                                parsedMonth = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0');
                            }
                        }
                        return {
                            ...p,
                            customerId: String(p.customerId).trim(),
                            month: parsedMonth,
                            status: String(p.status).trim()
                        };
                    });
                }
                
                if (data.admin && data.admin.pass) {
                    state.admin = data.admin;
                }
                
                saveCacheToLocalStorage();
                renderApp();

                if (isManual) {
                    showToast("Sinkron Sukses", `Data terbaru berhasil dimuat (${state.customers.length} pelanggan).`, "success");
                }
            } catch (error) {
                console.error("Gagal mengambil data cloud:", error);
                if (isManual) {
                    showToast("Sinkron Gagal", "Gagal menghubungi Google Sheets. Periksa URL atau koneksi internet.", "error");
                }
            } finally {
                if (syncIcon) syncIcon.classList.remove('animate-spin');
            }
        }

        window.onload = function() {
            loadCacheFromLocalStorage();

            const savedSession = localStorage.getItem('bayarque_session');
            if (savedSession) {
                try {
                    const sessionData = JSON.parse(savedSession);
                    currentUser = sessionData.user;
                    userRole = sessionData.role;
                } catch(e) {}
            }

            renderApp();

            const url = DATABASE_URL || localStorage.getItem('bayarque_script_url');
            if (url) {
                loadFromGoogleSheets(url, false);
            }
        };

        function showLoading(text) {
            const overlay = document.getElementById('loading-overlay');
            if (!overlay) return;
            document.getElementById('loading-text').innerText = text;
            overlay.classList.remove('hidden'); 
            overlay.classList.add('flex');
        }

        function hideLoading() {
            const overlay = document.getElementById('loading-overlay');
            if (!overlay) return;
            overlay.classList.add('hidden'); 
            overlay.classList.remove('flex');
        }

        function generateId() { return 'id_' + Math.random().toString(36).substr(2, 9); }
        function formatRp(angka) { return "Rp " + Number(angka || 0).toLocaleString('id-ID'); }
        
        function formatMonthName(yyyyMm) {
            if(!yyyyMm) return '';
            const [y, m] = yyyyMm.split('-');
            const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            return `${months[parseInt(m)-1] || ''} ${y}`;
        }

        window.formatTanggalBaca = function(isoString) {
            if (!isoString) return '-';
            const d = new Date(isoString);
            if(isNaN(d.getTime())) return isoString; 
            const pad = (n) => String(n).padStart(2, '0');
            if (isoString.includes('T')) {
                return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            }
            return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
        };

        function getNowLocal() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            return now.toISOString().slice(0, 16);
        }

        window.changeGlobalMonth = function(val) {
            if(!val) return;
            window.selectedMonth = val;
            renderApp(); 
        };

        window.updateGlobalMonth = function() {
            let m = document.getElementById('sel-month').value;
            let y = document.getElementById('sel-year').value;
            window.changeGlobalMonth(y + '-' + m);
        };

        window.formatRibuan = function(angka) {
            return Number(angka || 0).toLocaleString('id-ID');
        };

        window.formatInputRibuan = function(input) {
            let val = String(input.value).replace(/\D/g, ''); 
            if(val) input.value = Number(val).toLocaleString('id-ID');
            else input.value = '';
        };

        window.forceSync = async function() {
            const url = DATABASE_URL || localStorage.getItem('bayarque_script_url');
            if(!url) return showToast("Gagal", "URL Database belum diatur di Pengaturan.", "error");
            await loadFromGoogleSheets(url, true);
        };

        window.generatePesanWA = function(custId, type) {
            const cust = state.customers.find(c => c.id === custId);
            if (!cust) return { hp: '', text: '', name: '' };

            const pkg = state.packages.find(pk => pk.id === cust.packageId);
            const pkgName = pkg ? pkg.name : 'Internet Regular';
            let hargaBulanIni = pkg ? Number(pkg.price) : 0;
            if (cust.customPrice && Number(cust.customPrice) > 0) hargaBulanIni = Number(cust.customPrice);

            const monthKey = window.selectedMonth;
            const pay = state.payments.find(p => p.customerId === custId && p.month === monthKey);

            let hp = String(cust.phone || '').replace(/\D/g, '');
            if (hp.startsWith('0')) hp = '62' + hp.substring(1);

            let text = '';

            if (type === 'lunas') {
                const tglBayar = pay && pay.date ? formatTanggalBaca(pay.date) : formatTanggalBaca(getNowLocal());
                const metode = pay && pay.method ? pay.method : 'Cash (Tunai)';
                let petugas = 'Admin Pusat';
                if (pay && pay.technicianId && pay.technicianId !== 'admin') {
                    const tech = state.technicians.find(t => t.id === pay.technicianId);
                    if (tech) petugas = tech.name;
                }

                text = `*BUKTI PEMBAYARAN INTERNET LUNAS* ✅\n` +
                       `-----------------------------------------\n` +
                       `Halo Bapak/Ibu *${cust.name}*,\n` +
                       `Terima kasih, pembayaran tagihan internet Anda telah kami terima dengan rincian berikut:\n\n` +
                       `• *No. Layanan:* ${cust.id}\n` +
                       `• *Nama Pelanggan:* ${cust.name}\n` +
                       `• *Paket Internet:* ${pkgName}\n` +
                       `• *Bulan Penagihan:* ${formatMonthName(monthKey)}\n` +
                       `• *Waktu Pembayaran:* ${tglBayar}\n` +
                       `• *Metode Bayar:* ${metode}\n` +
                       `• *Diterima Oleh:* ${petugas}\n` +
                       `• *Total Bayar:* *${formatRp(hargaBulanIni)}*\n\n` +
                       `Status Layanan: *AKTIF / LUNAS* 🟢\n` +
                       `-----------------------------------------\n` +
                       `Terima kasih telah mempercayakan kebutuhan internet Anda kepada *BayarQue*. Semoga koneksi Anda selalu lancar! 🚀🙏`;
            } else if (type === 'tagihan' || type === 'nunggak') {
                let unpaidList = [];
                let dTemp = new Date(monthKey + "-01");
                for (let i = 0; i < 6; i++) {
                    let mStr = dTemp.toISOString().slice(0, 7);
                    if (mStr >= '2026-08') {
                        let checkPay = state.payments.find(p => p.customerId === custId && p.month === mStr);
                        if (!checkPay || checkPay.status !== 'Lunas') {
                            unpaidList.push(formatMonthName(mStr));
                        }
                    }
                    dTemp.setMonth(dTemp.getMonth() - 1);
                }

                let totalTagihan = unpaidList.length > 0 ? (unpaidList.length * hargaBulanIni) : hargaBulanIni;
                let infoBulan = unpaidList.length > 1 ? unpaidList.join(', ') : formatMonthName(monthKey);
                let catatanNunggak = unpaidList.length > 1 ? `\n⚠️ *Perhatian:* Anda memiliki tunggakan selama *${unpaidList.length} bulan* (${infoBulan}).` : '';

                text = `*PEMBERITAHUAN TAGIHAN INTERNET* 🔔\n` +
                       `-----------------------------------------\n` +
                       `Kepada Yth. Bapak/Ibu: *${cust.name}*\n` +
                       `Alamat: ${cust.address || '-'}\n\n` +
                       `Kami menginformasikan bahwa tagihan internet Anda telah jatuh tempo:\n\n` +
                       `• *Paket Layanan:* ${pkgName}\n` +
                       `• *Bulan Tagihan:* ${formatMonthName(monthKey)}\n` +
                       `• *Jatuh Tempo:* Setiap Tanggal ${cust.dueDate}\n` +
                       `• *Total Tagihan:* *${formatRp(totalTagihan)}*${catatanNunggak}\n\n` +
                       `Mohon untuk dapat segera menyelesaikan pembayaran agar layanan internet tetap aktif dan tidak mengalami isolir otomatis.\n\n` +
                       `*Cara Pembayaran:*\n` +
                       `1. Tunai melalui teknisi penagih resmi kami saat kunjungan.\n` +
                       `2. Datang langsung ke kantor kasir BayarQue.\n` +
                       `3. Transfer Bank / E-Wallet (Konfirmasikan ke kami setelah transfer).\n\n` +
                       `Jika Anda sudah melakukan pembayaran, mohon abaikan pesan ini. Terima kasih! 🙏`;
            } else {
                text = `Halo Bapak/Ibu *${cust.name}*,\n\nKami dari tim layanan internet *BayarQue*. Apakah ada kendala atau bantuan seputar jaringan internet di rumah Anda?\n\nTerima kasih. 🙏`;
            }

            return { hp, text, name: cust.name };
        };

        window.bukaModalWA = function(custId, type = 'tagihan') {
            const dataWA = generatePesanWA(custId, type);
            if (!dataWA.hp) {
                showToast("Nomor Kosong", "Nomor WhatsApp pelanggan belum diisi atau tidak valid.", "error");
                return;
            }

            const judul = type === 'lunas' ? 'Kirim Bukti Pembayaran Lunas (WA)' : (type === 'umum' ? 'Kirim Pesan Umum (WA)' : 'Kirim Pengingat Tagihan (WA)');

            const modalHTML = `
                <div class="fixed inset-0 bg-slate-900/70 z-50 flex justify-center items-center p-4 backdrop-blur-sm">
                    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden fade-in flex flex-col max-h-[92vh] border border-slate-200">
                        <div class="p-5 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-2xl bg-emerald-500 text-white flex items-center justify-center shadow-md">
                                    <i data-lucide="message-circle" class="w-6 h-6"></i>
                                </div>
                                <div>
                                    <h3 class="font-extrabold text-slate-800 text-base leading-tight">${judul}</h3>
                                    <p class="text-xs text-slate-500 font-medium">Tujuan: <strong class="text-slate-700">${dataWA.name}</strong> (+${dataWA.hp})</p>
                                </div>
                            </div>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-800 bg-white p-2 rounded-xl border border-slate-200 shadow-sm"><i data-lucide="x" class="w-4 h-4"></i></button>
                        </div>

                        <div class="p-5 overflow-y-auto custom-scrollbar flex-1 space-y-4">
                            <div>
                                <div class="flex justify-between items-center mb-1.5">
                                    <label class="text-xs font-bold text-slate-700 uppercase tracking-wide">Isi Pesan WhatsApp (Bisa diedit sebelum dikirim):</label>
                                    <button onclick="salinTeksWA()" class="text-xs font-bold text-blue-600 hover:text-blue-800 flex items-center gap-1 transition-colors">
                                        <i data-lucide="copy" class="w-3.5 h-3.5"></i> Salin Teks
                                    </button>
                                </div>
                                <textarea id="wa-text-content" rows="11" class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl text-xs md:text-sm text-slate-800 font-mono leading-relaxed outline-none focus:border-emerald-500 focus:bg-white transition-all resize-none shadow-inner">${dataWA.text}</textarea>
                            </div>
                        </div>

                        <div class="p-4 bg-slate-50 border-t border-slate-200 flex items-center justify-end gap-3">
                            <button onclick="closeModal()" class="px-5 py-2.5 text-sm font-bold text-slate-600 bg-white border border-slate-300 rounded-xl hover:bg-slate-100 transition-colors">Batal</button>
                            <button onclick="eksekusiKirimWA('${dataWA.hp}')" class="px-6 py-2.5 text-sm font-extrabold text-white bg-emerald-600 hover:bg-emerald-700 shadow-lg hover:shadow-emerald-600/30 rounded-xl flex items-center gap-2 transition-all active:scale-95">
                                <i data-lucide="send" class="w-4 h-4"></i> Buka WhatsApp & Kirim
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-root').innerHTML = modalHTML;
            if (window.lucide) lucide.createIcons();
        };

        window.salinTeksWA = function() {
            const ta = document.getElementById('wa-text-content');
            if (!ta) return;
            ta.select();
            document.execCommand('copy');
            showToast("Tersalin", "Teks pesan berhasil disalin ke clipboard.", "success");
        };

        window.eksekusiKirimWA = function(hp) {
            const ta = document.getElementById('wa-text-content');
            const pesan = ta ? ta.value : '';
            const url = `https://wa.me/${hp}?text=${encodeURIComponent(pesan)}`;
            window.open(url, '_blank');
            closeModal();
            showToast("Membuka WhatsApp", "Pesan telah dialihkan ke aplikasi WhatsApp.", "info");
        };

        window.kirimWA = function(phone, nama, type, tagihan, bulan, tglLunas) {
            if (!phone || phone === '-') return showToast("Gagal", "Nomor HP pelanggan tidak valid atau kosong.", "error");
            let cust = state.customers.find(c => String(c.phone).replace(/\D/g, '') === String(phone).replace(/\D/g, ''));
            if (cust) {
                bukaModalWA(cust.id, type);
            } else {
                let hp = String(phone).replace(/\D/g, '');
                if (hp.startsWith('0')) hp = '62' + hp.substring(1);
                let pesan = `Halo Bapak/Ibu *${nama}*,\n\nTerima kasih atas kerja samanya dengan BayarQue.`;
                window.open(`https://wa.me/${hp}?text=${encodeURIComponent(pesan)}`, '_blank');
            }
        };

        function renderApp() {
            const app = document.getElementById('app');
            if (!app) return;
            if (!currentUser) {
                app.innerHTML = getLoginHTML();
            } else {
                app.innerHTML = getLayoutHTML();
                renderMenuContent();
            }
            if (window.lucide) lucide.createIcons();
        }

        function getLoginHTML() {
            const internetBg = "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?auto=format&fit=crop&q=80&w=1600";
            return `
                <div class="h-screen w-screen relative flex items-center justify-center p-4 overflow-hidden select-none bg-slate-950">
                    <!-- Background Jaringan Internet & Dark Gradient Overlay -->
                    <div class="absolute inset-0 z-0">
                        <img src="${internetBg}" alt="Background Internet" class="w-full h-full object-cover filter brightness-[0.38] contrast-110 scale-105 transition-transform duration-1000">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/95 via-slate-900/60 to-slate-950/80 mix-blend-multiply"></div>
                    </div>

                    <!-- Kartu Login Transparan / Frosted Glass Style -->
                    <div class="w-full max-w-sm rounded-3xl p-8 relative z-10 fade-in text-center bg-white/90 backdrop-blur-xl border border-white/50 shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
                        <div class="w-20 h-20 bg-gradient-to-br from-blue-600 to-orange-500 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg border-2 border-white/60">
                            <i data-lucide="wifi" class="w-10 h-10 stroke-[2.5]"></i>
                        </div>
                        <h1 class="text-3xl font-black text-slate-900 tracking-tight drop-shadow-sm">Bayar<span class="text-orange-500">Que</span></h1>
                        <p class="text-slate-600 text-xs font-extrabold mt-1 uppercase tracking-wider">Portal Billing Internet Pintar</p>
                        
                        <form onsubmit="handleLogin(event)" class="mt-6 space-y-4 text-left">
                            <div id="login-error" class="hidden bg-red-50 text-red-600 p-3 rounded-xl text-xs font-extrabold border border-red-200 text-center"></div>
                            
                            <div>

        window.handleLogin = function(event) {
            event.preventDefault();
            const p = document.getElementById('login-pass').value.trim();
            const errorDiv = document.getElementById('login-error');

            if (String(p) === String(state.admin.pass)) {
                currentUser = { id: 'admin', name: 'Administrator' };
                userRole = 'admin';
            } else {
                const tech = state.technicians.find(t => String(t.pass || '') === p);
                if (tech) {
                    currentUser = tech;
                    userRole = 'teknisi';
                } else {
                    errorDiv.innerHTML = `<i data-lucide="alert-circle" class="w-4 h-4 inline mb-0.5"></i> Kata sandi tidak ditemukan!`;
                    errorDiv.classList.remove('hidden');
                    if (window.lucide) lucide.createIcons();
                    return;
                }
            }

            localStorage.setItem('bayarque_session', JSON.stringify({ user: currentUser, role: userRole }));
            currentMenu = 'dashboard';
            renderApp();
            showToast("Login Berhasil", `Selamat datang, ${currentUser.name}!`, "success");
        };

            currentUser = null; 
            userRole = null;
            localStorage.removeItem('bayarque_session');

        window.renderDashboardChart = function() {
            const ctx = document.getElementById('revenueChart');
            if(!ctx) return;
            
            let labels = [];
            let dataRevenue = [];
            let dDate = new Date(window.selectedMonth + "-01");
            
            for (let i = 5; i >= 0; i--) {
                let tempD = new Date(dDate);
                tempD.setMonth(tempD.getMonth() - i);
                let mStr = tempD.toISOString().slice(0, 7);
                
                let rev = state.payments
                    .filter(p => p.month === mStr && p.status === 'Lunas')
                    .reduce((sum, p) => sum + Number(p.amount || 0), 0);
                    
                labels.push(formatMonthName(mStr));
                dataRevenue.push(rev);
            }

            if (window.myChartInstance) {
                window.myChartInstance.destroy();
                window.myChartInstance = null;
            }

            window.myChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Total Pendapatan (Rp)',
                        data: dataRevenue,
                        backgroundColor: 'rgba(37, 99, 235, 0.85)',
                        hoverBackgroundColor: 'rgba(37, 99, 235, 1)',
                        borderRadius: 8,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { label: function(context) { return 'Rp ' + context.parsed.y.toLocaleString('id-ID'); } } }
                    },
                    scales: {
                        y: { beginAtZero: true, ticks: { callback: function(value) { return 'Rp ' + value.toLocaleString('id-ID'); } } }
                    }
                }
            });
        };

        window.openModalDashboardDetail = function(type, filterDue = 'all') {
            const monthKey = window.selectedMonth;
            let myCustomers = state.customers.filter(c => c.status === 'Aktif');
            let myPayments = state.payments;

            let title = type === 'lunas' ? 'Data Pelanggan (Sudah Lunas)' : 'Data Pelanggan (Belum Bayar)';
            let bgColor = type === 'lunas' ? 'bg-emerald-50 border-emerald-100 text-emerald-800' : 'bg-red-50 border-red-100 text-red-800';
            let icon = type === 'lunas' ? 'check-circle' : 'alert-circle';

            let baseFiltered = myCustomers.filter(c => {
                const pay = myPayments.find(p => p.customerId === c.id && p.month === monthKey);
                if (type === 'lunas') return pay && pay.status === 'Lunas';
                return !pay || pay.status !== 'Lunas';
            });

            let count15 = baseFiltered.filter(c => String(c.dueDate) === '15').length;
            let count25 = baseFiltered.filter(c => String(c.dueDate) === '25').length;

            let filtered = baseFiltered;
            if (filterDue !== 'all') {
                filtered = baseFiltered.filter(c => String(c.dueDate) === String(filterDue));
            }

            filtered.sort((a, b) => Number(a.dueDate) - Number(b.dueDate));

            let listHTML = filtered.map((c, i) => {
                const pkg = state.packages.find(pk => pk.id === c.packageId);
                let tagihan = pkg ? Number(pkg.price || 0) : 0;
                if (c.customPrice && Number(c.customPrice) > 0) tagihan = Number(c.customPrice);

                return `
                    <div class="flex justify-between items-center py-3 border-b border-slate-100 last:border-0 hover:bg-slate-50 p-2 rounded-xl transition-colors">
                        <div>
                            <p class="font-bold text-sm text-slate-800">${i+1}. ${c.name}</p>
                            <p class="text-xs text-slate-500 flex items-center gap-1 mt-0.5"><i data-lucide="phone" class="w-3 h-3"></i> ${c.phone}</p>

                        </div>
                    </div>
                `;
            }).join('');

            if(listHTML === '') listHTML = `<div class="p-8 text-center text-slate-400 font-bold text-sm">Tidak ada data di kategori ini.</div>`;

            const html = `
                <div class="fixed inset-0 bg-slate-900/60 z-50 flex justify-center items-center p-4 backdrop-blur-sm">
                    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden fade-in flex flex-col max-h-[85vh] border border-slate-200">
                        <div class="p-5 border-b flex justify-between items-center ${bgColor}">
                            <h3 class="text-base font-extrabold flex items-center gap-2"><i data-lucide="${icon}" class="w-5 h-5"></i> ${title}</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-800 bg-white p-1.5 rounded-xl shadow-sm"><i data-lucide="x" class="w-4 h-4"></i></button>
                        </div>
                        <div class="p-3 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                            <div class="flex gap-2">
                                <span class="text-[10px] font-extrabold bg-blue-100 text-blue-700 px-2.5 py-1 rounded-lg">Tgl 15: ${count15} Org</span>
                                <span class="text-[10px] font-extrabold bg-amber-100 text-amber-700 px-2.5 py-1 rounded-lg">Tgl 25: ${count25} Org</span>
                            </div>
                            <select onchange="openModalDashboardDetail('${type}', this.value)" class="text-xs border border-slate-200 rounded-xl p-2 outline-none font-bold text-slate-700 bg-white cursor-pointer shadow-sm">
                                <option value="all" ${filterDue === 'all' ? 'selected' : ''}>Semua Tanggal</option>
                                <option value="15" ${filterDue === '15' ? 'selected' : ''}>Hanya Tgl 15</option>
                                <option value="25" ${filterDue === '25' ? 'selected' : ''}>Hanya Tgl 25</option>
                            </select>
                        </div>
                        <div class="overflow-y-auto p-4 custom-scrollbar">
                            ${listHTML}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-root').innerHTML = html;
            if (window.lucide) lucide.createIcons();

                tbody.innerHTML = getCustomerRowsHTML();

        window.handleSearchCustomer = function(val) {
            window.searchCustomer = val;

            if (tbody) { 
                tbody.innerHTML = getCustomerRowsHTML(); 
                if (window.lucide) lucide.createIcons(); 
            }
        };

        function getCustomerRowsHTML() {
            const monthKey = window.selectedMonth;

            const d = new Date(monthKey + "-01");
            const m0 = d.toISOString().slice(0, 7); 
            d.setMonth(d.getMonth() - 1); const m1 = d.toISOString().slice(0, 7); 
            d.setMonth(d.getMonth() - 1); const m2 = d.toISOString().slice(0, 7); 
            const last3Months = [m0, m1, m2].filter(m => m >= '2026-08');

            let filteredCust = state.customers;

            if (window.searchCustomer) {
                const q = String(window.searchCustomer).toLowerCase().trim();
                filteredCust = filteredCust.filter(c => 
                    String(c.name || '').toLowerCase().includes(q) || 
                    String(c.phone || '').toLowerCase().includes(q) ||
                    String(c.address || '').toLowerCase().includes(q)
                );
            }
            
            if (window.filterCustomerPay === 'lunas') {
                filteredCust = filteredCust.filter(c => {
                    const pay = state.payments.find(p => p.customerId === c.id && p.month === monthKey);
                    return pay && pay.status === 'Lunas';
                });
            } else if (window.filterCustomerPay === 'belum') {
                filteredCust = filteredCust.filter(c => {
                    const pay = state.payments.find(p => p.customerId === c.id && p.month === monthKey);
                    return !pay || pay.status !== 'Lunas';
                });
            } else if (window.filterCustomerPay === 'nunggak') {
                filteredCust = filteredCust.filter(c => {
                    let nunggakCount = 0;
                    last3Months.forEach(m => {
                        const pay = state.payments.find(p => p.customerId === c.id && p.month === m);
                        if (!pay || pay.status !== 'Lunas') nunggakCount++;
                    });
                    return nunggakCount >= 1;
                });
            }

            let trs = filteredCust.map(c => {
                const pkg = state.packages.find(p => p.id === c.packageId);
                const pkgDisplay = pkg ? pkg.name : '-';
                
                let tagihan = pkg ? Number(pkg.price || 0) : 0;
                if (c.customPrice && Number(c.customPrice) > 0) tagihan = Number(c.customPrice);
                
                const pay = state.payments.find(p => p.customerId === c.id && p.month === monthKey);
                
                let payBadge = `<span class="px-2.5 py-1 bg-slate-100 text-slate-600 rounded-full text-xs font-extrabold">Belum Ditagih</span>`;
                let payNote = `<div class="text-[11px] text-slate-400 mt-1.5 font-bold">Jatuh Tempo: Tgl ${c.dueDate}</div>`;
                
                if(pay) {
                    if(pay.status === 'Lunas') {
                        payBadge = `<span class="px-2.5 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full text-xs font-extrabold"><i data-lucide="check" class="w-3 h-3 inline"></i> Lunas</span>`;
                        payNote = `<div class="text-[11px] text-emerald-600 mt-1.5 font-bold">Via ${pay.method} (${formatTanggalBaca(pay.date)})</div>`;
                    } else {
                        payBadge = `<span class="px-2.5 py-1 bg-red-50 text-red-700 border border-red-200 rounded-full text-xs font-extrabold"><i data-lucide="x" class="w-3 h-3 inline"></i> Belum Bayar</span>`;
                        payNote = `<div class="text-[11px] text-red-500 mt-1.5 font-bold truncate max-w-[150px]" title="${pay.reason || ''}">Ket: ${pay.reason || '-'}</div>`;
                    }
                }

                const gmapsLink = c.mapUrl ? c.mapUrl : (c.address && c.address !== '-' ? `https://maps.google.com/?q=${encodeURIComponent(c.address)}` : '');
                const mapIcon = gmapsLink ? `<a href="${gmapsLink}" target="_blank" class="text-blue-500 hover:text-blue-700 bg-blue-50 p-1 rounded-lg border border-blue-100 flex-shrink-0 ml-1 inline-flex items-center justify-center" title="Arahkan Lokasi"><i data-lucide="map" class="w-3.5 h-3.5"></i></a>` : '';

                let canEditPrice = false;
                if (userRole === 'admin') canEditPrice = true;
                else if (userRole === 'teknisi' && currentUser.allowEditPrice) canEditPrice = true;

                let editPriceBtn = canEditPrice 
                    ? `<button onclick="openModalCustomPrice('${c.id}')" class="text-amber-600 bg-amber-50 hover:bg-amber-100 p-2.5 rounded-xl transition-colors border border-amber-200 flex items-center justify-center shadow-sm" title="Ubah Nominal Khusus">
                            <i data-lucide="dollar-sign" class="w-4 h-4"></i>
                       </button>`
                    : `<button onclick="showToast('Akses Ditolak', 'Anda tidak diizinkan mengubah Nominal Khusus. Hubungi Admin.', 'error')" class="text-slate-400 bg-slate-100 p-2.5 rounded-xl border border-slate-200 flex items-center justify-center shadow-sm cursor-not-allowed" title="Terkunci">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                       </button>`;

                const waBtnUmum = `<button onclick="bukaModalWA('${c.id}', 'umum')" class="text-emerald-500 hover:text-emerald-700 bg-emerald-50 hover:bg-emerald-100 p-1 rounded-lg border border-emerald-200 flex-shrink-0 ml-1 transition-colors" title="Kirim Pesan WhatsApp"><i data-lucide="message-circle" class="w-3.5 h-3.5"></i></button>`;

                return `
                    <tr class="hover:bg-slate-50/80 border-b border-slate-100 last:border-0 transition-colors">
                        <td class="p-4 align-top">
                            <div class="font-extrabold text-slate-800 text-sm md:text-base">${c.name} <span class="${c.status==='Non-Aktif'?'bg-red-100 text-red-600 px-2 py-0.5 rounded text-[10px] ml-1 font-black':'hidden'}">NON-AKTIF</span></div>
                            <div class="text-xs text-slate-600 flex items-center gap-1 mt-1 font-medium"><i data-lucide="phone" class="w-3 h-3"></i> ${c.phone} ${waBtnUmum}</div>
                            <div class="text-xs text-slate-500 flex items-start gap-1 mt-1 whitespace-normal leading-relaxed max-w-[250px]"><i data-lucide="map-pin" class="w-3 h-3 mt-0.5 flex-shrink-0"></i> <span>${c.address || '-'}</span> ${mapIcon}</div>
                        </td>
                        <td class="p-4 align-top">
                            <div class="text-slate-700 text-xs font-bold bg-slate-100 px-2 py-1 rounded-lg w-max">${pkgDisplay}</div>
                            <div class="text-sm font-black text-blue-600 mt-1.5">${formatRp(tagihan)} ${c.customPrice ? '<span class="text-amber-600 text-[10px] uppercase ml-1">(Khusus)</span>' : ''}</div>
                        </td>
                        <td class="p-4 align-top">
                            <div class="flex items-center">${payBadge}</div>
                            ${payNote}
                        </td>
                        <td class="p-4 align-top">
                            <div class="flex gap-2">
                                ${editPriceBtn}
                                <button onclick="openModalCustomer('${c.id}')" class="text-blue-600 bg-blue-50 hover:bg-blue-100 p-2.5 rounded-xl transition-colors border border-blue-200 flex items-center justify-center shadow-sm" title="Edit Data">
                                    <i data-lucide="edit-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            if(trs === '') trs = `<tr><td colspan="4" class="p-10 text-center text-slate-400 font-bold text-sm">Tidak ada data pelanggan yang cocok.</td></tr>`;

            return trs;
        }

                        </div>

                        <div class="flex flex-col md:flex-row gap-3 w-full xl:w-auto items-stretch md:items-center">
                            <div class="flex items-center gap-2 w-full md:w-auto bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2">

                                    <option value="" ${window.filterCustomerPay === '' ? 'selected' : ''}>Semua Status</option>

                                <input id="fc-custom-price" type="text" oninput="formatInputRibuan(this)" value="${cust.customPrice ? formatRibuan(cust.customPrice) : ''}" placeholder="Cth: 130.000" class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-200 rounded-2xl outline-none focus:border-amber-500 focus:bg-white font-black text-slate-900 transition-all text-lg text-right">

                            </div>
                        </form>

                </div>
            `;
            document.getElementById('modal-root').innerHTML = html;

        window.saveCustomPrice = async function(e, id) {
            e.preventDefault();
            let cust = state.customers.find(c => c.id === id);
            let newPriceInput = document.getElementById('fc-custom-price').value;
            let newPrice = newPriceInput.replace(/\D/g, ''); 
            cust.customPrice = newPrice ? Number(newPrice) : '';
            
            closeModal();
            renderMenuContent();
            await syncToDatabase("Menyimpan Harga Khusus...");
            showToast("Harga Diperbarui", "Nominal khusus pelanggan berhasil disimpan.", "success");
        };

        window.exportCustomersCSV = function() {
            const monthKey = window.selectedMonth;
            const headers = ['ID', 'Nama', 'Alamat', 'No. HP', 'Paket', 'Nominal Tagihan', 'Tgl Jatuh Tempo', 'Status Berlangganan', 'Status Pembayaran Bulan Ini'];
            
            const rows = state.customers.map(c => {
                const pkg = state.packages.find(p => p.id === c.packageId);
                const pkgName = pkg ? pkg.name : '-';
                let tagihan = pkg ? Number(pkg.price || 0) : 0;
                if (c.customPrice && Number(c.customPrice) > 0) tagihan = Number(c.customPrice);

                const pay = state.payments.find(p => p.customerId === c.id && p.month === monthKey);
                let payStat = 'Belum Ditagih';
                if(pay) payStat = pay.status === 'Lunas' ? `Lunas (${pay.method})` : `Belum Bayar (${pay.reason || '-'})`;

                return `"${c.id}";"${c.name}";"${c.address || ''}";"${c.phone}";"${pkgName}";"${tagihan}";"${c.dueDate}";"${c.status}";"${payStat}"`;
            });
            const csvContent = "\uFEFF" + [headers.join(';'), ...rows].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.setAttribute("href", URL.createObjectURL(blob));
            link.setAttribute("download", `Data_Pelanggan_${monthKey}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.processImportCSV = async function() {
            const pkgId = document.getElementById('csv-pkg').value;
            const due = document.getElementById('csv-due').value;
            const status = document.getElementById('csv-status').value;
            const fileInput = document.getElementById('csv-file');

            let errors = [];
            if (!pkgId) errors.push("- Paket Internet belum dipilih!");
            if (!fileInput.files.length) errors.push("- Anda belum memasukkan file CSV!");

            if (errors.length > 0) { showToast("Import Gagal", "Paket Internet dan File CSV wajib diisi!", "error"); return; }

            const file = fileInput.files[0];
            const reader = new FileReader();
            
            reader.onload = async function(e) {
                const text = e.target.result;
                const rows = text.split('\n');
                if (rows.length < 2) { showToast("Import Gagal", "File CSV kosong atau format salah!", "error"); return; }

                const header = rows[0].toLowerCase();
                const separator = header.includes(';') ? ';' : ',';
                const headers = header.split(separator).map(h => h.replace(/['"]+/g, '').trim());

                let idxName = headers.findIndex(h => h.includes('nama'));
                let idxPhone = headers.findIndex(h => h.includes('hp') || h.includes('phone') || h.includes('telepon'));
                let idxAddr = headers.findIndex(h => h.includes('alamat') || h.includes('address'));

                if (idxName === -1) idxName = 0; 
                if (idxAddr === -1 && headers.length >= 2) idxAddr = 1; 
                if (idxPhone === -1 && headers.length >= 3) idxPhone = 2; 

                let successCount = 0;
                for (let i = 1; i < rows.length; i++) {
                    const line = rows[i].trim();
                    if (!line) continue;
                    const cols = line.split(separator).map(c => c.replace(/['"]+/g, '').trim());
                    if (cols.length < 2 || !cols[idxName]) continue;

                    state.customers.push({
                        id: generateId(), 
                        name: cols[idxName], 
                        address: (idxAddr !== -1 && cols[idxAddr]) ? cols[idxAddr] : '-', 
                        phone: (idxPhone !== -1 && cols[idxPhone]) ? cols[idxPhone] : '-',
                        mapUrl: '',
                        packageId: pkgId, 
                        dueDate: due, 
                        status: status, 
                        customPrice: ''
                    });
                    successCount++;
                }

                closeModal();
                renderMenuContent();
                showToast("Import Sukses", `Berhasil memasukkan ${successCount} data pelanggan.`, "success");
                await syncToDatabase("Menyimpan Data Import...");
            };
            reader.readAsText(file);
        };

        function getPaymentRowsHTML(due) {
            const monthKey = window.selectedMonth;
            
            let filteredCust = state.customers.filter(c => String(c.dueDate).trim() === String(due).trim() && String(c.status).trim().toLowerCase() === 'aktif');
            
            let filterValue = due === 15 ? (window.filterPay15 || 'belum') : (window.filterPay25 || 'belum');
            let searchValue = due === 15 ? window.searchPayment15 : window.searchPayment25;
            let filterTechValue = due === 15 ? (window.filterTech15 || 'all') : (window.filterTech25 || 'all');
            
            if (searchValue) {
                const q = String(searchValue).toLowerCase().trim();
                filteredCust = filteredCust.filter(c => 
                    String(c.name || '').toLowerCase().includes(q) || 
                    String(c.phone || '').toLowerCase().includes(q) ||
                    String(c.address || '').toLowerCase().includes(q)
                );
            }

            if (filterValue === 'lunas') {
                filteredCust = filteredCust.filter(c => {
                    const pay = state.payments.find(p => p.customerId === c.id && p.month === monthKey);
                    return pay && pay.status === 'Lunas';

            } else if (filterValue === 'nunggak') {
                filteredCust = filteredCust.filter(c => {
                    const pay = state.payments.find(p => p.customerId === c.id && p.month === monthKey);
                    return pay && pay.status === 'Belum Bayar';
                });
            } else if (filterValue === 'belum') {
                filteredCust = filteredCust.filter(c => {
                    const pay = state.payments.find(p => p.customerId === c.id && p.month === monthKey);
                    return !pay;
                });

            if (filterTechValue !== 'all') {

                    const pay = state.payments.find(p => p.customerId === c.id && p.month === monthKey);

            if(trs === '') trs = `<tr><td colspan="3" class="p-10 text-center text-slate-400 font-bold text-sm">Tidak ada data tagihan yang sesuai.</td></tr>`;

                    if (!checkPay || checkPay.status !== 'Lunas') {
                        unpaidMonths.push({ month: mStr, label: formatMonthName(mStr) });

        window.savePayment = async function(e, custId, tagihanPerBulan) {
            e.preventDefault();
            const status = document.getElementById('pay-status').value;
            const method = status === 'Lunas' ? document.getElementById('pay-method').value : '';
            const payDate = status === 'Lunas' ? document.getElementById('pay-date').value : '';
            const payReason = status === 'Belum Bayar' ? document.getElementById('pay-reason').value : '';
            
            let finalTechId = currentUser.id;
            if (status === 'Lunas' && method === 'Datang ke Kantor') finalTechId = 'admin';

            let unpaidMonths = JSON.parse(document.getElementById('hidden-unpaid').value || '[]');
            
            if (status === 'Lunas' && unpaidMonths.length > 0) {
                unpaidMonths.forEach(mObj => {
                    const existingPay = state.payments.find(p => p.customerId === custId && p.month === mObj.month);
                    const payId = existingPay ? existingPay.id : generateId();
                    const data = {
                        id: payId,
                        customerId: custId,
                        month: mObj.month,
                        status: 'Lunas',
                        amount: tagihanPerBulan,
                        method: method,
                        date: payDate,
                        reason: '',
                        technicianId: finalTechId
                    };
                    if (existingPay) Object.assign(existingPay, data);
                    else state.payments.push(data);
                });
            } else {
                const existingPay = state.payments.find(p => p.customerId === custId && p.month === window.selectedMonth);
                const payId = existingPay ? existingPay.id : generateId();
                const data = {
                    id: payId,
                    customerId: custId,
                    month: window.selectedMonth,
                    status: status,
                    amount: status === 'Lunas' ? tagihanPerBulan : 0,
                    method: method,
                    date: payDate,
                    reason: payReason,
                    technicianId: finalTechId
                };
                if (existingPay) Object.assign(existingPay, data);
                else state.payments.push(data);
            }

            closeModal();
            renderMenuContent();
            await syncToDatabase("Menyimpan Tagihan...");
            showToast("Pembayaran Sukses", "Data tagihan telah disimpan ke database.", "success");
        };

        window.reportFilterDue = 'all';
        window.changeReportFilter = function(val) {
            window.reportFilterDue = val;
            renderMenuContent();
        };

        function getViewReports() {
            const monthKey = window.selectedMonth;
            let allLunas = state.payments.filter(p => p.month === monthKey && p.status === 'Lunas');
            
            if (window.reportFilterDue && window.reportFilterDue !== 'all') {
                allLunas = allLunas.filter(p => {
                    let cust = state.customers.find(c => c.id === p.customerId);
                    return cust && String(cust.dueDate) === String(window.reportFilterDue);
                });
            }

            let reportData = [];
            if (userRole === 'admin') {
                reportData = state.technicians.map(t => {
                    const techPayments = allLunas.filter(p => String(p.technicianId) === String(t.id) && p.method !== 'Datang ke Kantor');
                    const rev = techPayments.reduce((sum, p) => sum + Number(p.amount || 0), 0);
                    return { techId: t.id, name: t.name, revenue: rev, trxCount: techPayments.length };
                });
                
                const adminPayments = allLunas.filter(p => String(p.technicianId) === 'admin' || !p.technicianId || p.method === 'Datang ke Kantor');
                if(adminPayments.length > 0) {
                    const adminRev = adminPayments.reduce((sum, p) => sum + Number(p.amount || 0), 0);
                    reportData.unshift({ techId: 'admin', name: 'Administrator (Pusat)', revenue: adminRev, trxCount: adminPayments.length });
                }
            } else {
                const techPayments = allLunas.filter(p => String(p.technicianId) === String(currentUser.id) && p.method !== 'Datang ke Kantor');
                const rev = techPayments.reduce((sum, p) => sum + Number(p.amount || 0), 0);
                reportData = [{ techId: currentUser.id, name: currentUser.name, revenue: rev, trxCount: techPayments.length }];
            }

            let totalOmset = reportData.reduce((sum, r) => sum + r.revenue, 0);

            let cards = reportData.map((r, index) => {
                let bgColor = "bg-slate-800";
                let btnClass = "bg-white text-slate-800 hover:bg-slate-100";
                
                if (r.techId === 'admin') {
                    bgColor = "bg-blue-600";
                    btnClass = "bg-blue-800 text-white hover:bg-blue-900";
                } else {
                    const colors = [
                        {bg: "bg-emerald-600", btn: "bg-emerald-800 hover:bg-emerald-900 text-white"},
                        {bg: "bg-purple-600", btn: "bg-purple-800 hover:bg-purple-900 text-white"},
                        {bg: "bg-amber-600", btn: "bg-amber-800 hover:bg-amber-900 text-white"},
                        {bg: "bg-rose-600", btn: "bg-rose-800 hover:bg-rose-900 text-white"}
                    ];
                    const c = colors[index % colors.length];
                    bgColor = c.bg;
                    btnClass = c.btn;
                }

                return `
                <div class="${bgColor} p-6 rounded-3xl shadow-sm hover:shadow-md transition-shadow relative overflow-hidden group flex flex-col justify-between text-white">
                    <div class="absolute -right-4 -bottom-4 opacity-10 group-hover:scale-110 transition-transform"><i data-lucide="receipt" class="w-32 h-32 text-white"></i></div>
                    <div class="flex items-start gap-4 mb-4 relative z-10">
                        <div class="w-12 h-12 rounded-2xl bg-white/20 flex items-center justify-center font-black text-lg border border-white/30 shadow-sm flex-shrink-0">${r.name.charAt(0)}</div>
                        <div class="flex-1">
                            <p class="font-black text-base leading-tight">${r.name}</p>
                            <p class="text-[11px] font-bold bg-black/20 px-2.5 py-0.5 rounded-lg w-max mt-1.5 border border-black/10">${r.trxCount} Pembayaran</p>
                        </div>
                    </div>
                    <div class="pt-4 border-t border-white/20 relative z-10 flex justify-between items-end gap-2">
                        <div>
                            <p class="text-[10px] font-bold uppercase tracking-wider mb-0.5 text-white/80">Setoran Terkumpul</p>
                            <p class="text-xl font-black">${formatRp(r.revenue)}</p>
                        </div>
                        <button onclick="downloadLaporanPDF('${r.techId}', '${r.name}')" class="${btnClass} px-3.5 py-2 rounded-xl shadow-sm transition-colors flex items-center justify-center gap-1.5 text-xs font-bold border border-black/10">
                            <i data-lucide="download" class="w-3.5 h-3.5"></i> PDF
                        </button>
                    </div>
                </div>
            `}).join('');

            if(cards === '') cards = `<div class="col-span-full p-8 text-center text-slate-400 font-bold text-sm bg-white rounded-3xl border border-slate-200">Belum ada data setoran bulan ini.</div>`;

            return `
                <div class="space-y-6 max-w-5xl mx-auto">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="flex flex-col gap-1">
                            <h2 class="text-2xl font-black text-slate-800 flex items-center gap-2"><i data-lucide="file-text" class="w-6 h-6 text-blue-600"></i> Laporan Keuangan</h2>
                            <p class="text-sm text-slate-500 font-medium">Periode laporan: <span class="font-bold text-blue-600">${formatMonthName(monthKey)}</span></p>
                        </div>

                        <div class="flex items-center gap-2 bg-white px-4 py-2 rounded-2xl border border-slate-200 shadow-sm w-full md:w-auto">
                            <i data-lucide="filter" class="w-4 h-4 text-slate-400"></i>
                            <select onchange="changeReportFilter(this.value)" class="w-full bg-transparent outline-none text-xs font-bold text-slate-700 cursor-pointer">
                                <option value="all" ${window.reportFilterDue === 'all' ? 'selected' : ''}>Semua Tanggal Tagihan</option>
                                <option value="15" ${window.reportFilterDue === '15' ? 'selected' : ''}>Hanya Tagihan Tgl 15</option>
                                <option value="25" ${window.reportFilterDue === '25' ? 'selected' : ''}>Hanya Tagihan Tgl 25</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                        ${cards}
                    </div>

                    <div class="bg-gradient-to-r from-blue-700 to-blue-600 p-8 rounded-3xl text-white shadow-xl flex flex-col md:flex-row items-center justify-between gap-6 border border-blue-800 relative overflow-hidden mt-4">
                        <div class="absolute -left-10 -bottom-10 opacity-10"><i data-lucide="banknote" class="w-64 h-64 text-white"></i></div>
                        <div class="relative z-10 flex items-center gap-4">
                            <div class="bg-white/10 p-3 rounded-2xl backdrop-blur-sm border border-white/20"><i data-lucide="wallet" class="w-8 h-8 text-white"></i></div>
                            <div>
                                <h3 class="text-base font-bold text-blue-100">Total Omset ${userRole === 'admin' ? 'Keseluruhan' : 'Anda'}</h3>
                                <p class="text-xs text-blue-200 mt-0.5">Uang masuk yang berhasil ditagih bulan ini</p>
                            </div>
                        </div>
                        <p class="text-3xl md:text-5xl font-black relative z-10 drop-shadow-md">${formatRp(totalOmset)}</p>
                    </div>
                </div>
            `;
        }

        window.downloadLaporanPDF = function(techId, techName) {
            showLoading("Memproses File PDF...");
            
            const monthKey = window.selectedMonth;
            let techPayments = state.payments.filter(p => p.month === monthKey && p.status === 'Lunas');

            if (String(techId) === 'admin') {
                techPayments = techPayments.filter(p => String(p.technicianId) === 'admin' || !p.technicianId || p.method === 'Datang ke Kantor');
            } else {
                techPayments = techPayments.filter(p => String(p.technicianId) === String(techId) && p.method !== 'Datang ke Kantor');
            }
            
            let titleFilter = "";
            if (window.reportFilterDue && window.reportFilterDue !== 'all') {
                techPayments = techPayments.filter(p => {
                    let cust = state.customers.find(c => c.id === p.customerId);
                    return cust && String(cust.dueDate) === String(window.reportFilterDue);
                });
                titleFilter = ` (Tgl ${window.reportFilterDue})`;
            }

            let rows = techPayments.map((p, i) => {
                let cust = state.customers.find(c => c.id === p.customerId) || {};
                const pkg = state.packages.find(pk => pk.id === cust.packageId);
                let pkgName = pkg ? pkg.name : '-';

                return `
                    <tr style="border-bottom: 1px solid #ddd; background-color: #fff;">
                        <td style="padding: 10px 8px; text-align: center; border: 1px solid #ddd; color: #000;">${i+1}</td>
                        <td style="padding: 10px 8px; border: 1px solid #ddd; color: #000;"><strong>${cust.name || 'Unknown'}</strong><br><span style="font-size:10px;color:#555;">${cust.phone || '-'}</span></td>
                        <td style="padding: 10px 8px; border: 1px solid #ddd; color: #000;">${pkgName}</td>
                        <td style="padding: 10px 8px; border: 1px solid #ddd; color: #000;">${formatTanggalBaca(p.date)}</td>
                        <td style="padding: 10px 8px; border: 1px solid #ddd; color: #000;">${p.method}</td>
                        <td style="padding: 10px 8px; text-align: right; border: 1px solid #ddd; color: #000;"><strong>${formatRp(p.amount)}</strong></td>
                    </tr>
                `;
            }).join('');
            
            let total = techPayments.reduce((sum, p) => sum + Number(p.amount || 0), 0);

            const htmlContent = `
                <div style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; padding: 40px; color: #000; width: 100%; box-sizing: border-box; background-color: #ffffff;">
                    <div style="border-bottom: 3px solid #2563eb; padding-bottom: 15px; margin-bottom: 25px; text-align: center;">
                        <h1 style="margin: 0; color: #2563eb; font-size: 24px; font-weight: 800; text-transform: uppercase;">Laporan Setoran Penagihan${titleFilter}</h1>
                        <p style="margin: 5px 0 0 0; color: #555; font-size: 13px;">Periode: ${formatMonthName(monthKey)}</p>
                    </div>
                    
                    <table style="width: 100%; margin-bottom: 20px; font-size: 13px; border: none; background-color: #ffffff;">
                        <tr>
                            <td style="width: 120px; font-weight: bold; color: #333;">Petugas</td>
                            <td style="font-weight: bold; color: #000;">: ${techName}</td>
                            <td style="text-align: right; color: #555;">Tanggal Cetak: ${new Date().toLocaleDateString('id-ID')}</td>
                        </tr>
                    </table>
                    
                    <table style="width: 100%; border-collapse: collapse; font-size: 12px; border: 1px solid #ccc; background-color: #ffffff;">
                        <thead style="background-color: #f1f5f9;">
                            <tr style="text-align: left; color: #000;">
                                <th style="padding: 10px 8px; text-align: center; border: 1px solid #ddd;">No</th>
                                <th style="padding: 10px 8px; border: 1px solid #ddd;">Nama Pelanggan</th>
                                <th style="padding: 10px 8px; border: 1px solid #ddd;">Paket</th>
                                <th style="padding: 10px 8px; border: 1px solid #ddd;">Waktu Bayar</th>
                                <th style="padding: 10px 8px; border: 1px solid #ddd;">Metode</th>
                                <th style="padding: 10px 8px; text-align: right; border: 1px solid #ddd;">Nominal</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows || '<tr style="background-color: #fff;"><td colspan="6" style="padding: 20px; text-align: center; color: #666; border: 1px solid #ddd;">Belum ada data setoran untuk periode ini.</td></tr>'}
                        </tbody>
                        <tfoot>
                            <tr style="background-color: #eff6ff; font-weight: bold;">
                                <td colspan="5" style="padding: 12px 10px; text-align: right; color: #000; border: 1px solid #ddd;">TOTAL SETORAN (${techPayments.length} TRX) :</td>
                                <td style="padding: 12px 10px; text-align: right; color: #000; border: 1px solid #ddd; font-size: 14px;">${formatRp(total)}</td>
                            </tr>
                        </tfoot>
                    </table>
                    
                    <div style="text-align: right; margin-top: 50px; font-size: 13px; color: #333; page-break-inside: avoid;">
                        <div style="display: inline-block; text-align: center; width: 200px;">
                            <p style="margin-bottom: 70px;">Diterima Oleh,</p>
                            <p style="font-weight: bold; border-bottom: 1px solid #000; padding-bottom: 4px; margin-bottom: 4px;">Admin Keuangan</p>
                            <p style="font-size: 10px; color: #666;">BayarQue System</p>
                        </div>
                    </div>
                </div>
            `;

            if(typeof html2pdf !== 'undefined') {
                const opt = {
                    margin:       0.3, 
                    filename:     `Laporan_Setoran_${techName.replace(/\s+/g, '_')}${titleFilter.replace(/\s+/g, '_')}_${monthKey}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, useCORS: true, logging: false },
                    jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
                };

                const tempElement = document.createElement('div');
                tempElement.innerHTML = htmlContent;

                html2pdf().set(opt).from(tempElement).save().then(() => {
                    hideLoading();
                }).catch(err => {
                    console.error("PDF Error:", err);
                    hideLoading();
                    showToast("Gagal", "Terjadi kesalahan saat memproses file PDF.", "error");
                });
            } else {
                hideLoading();
                showToast("Sistem Error", "Library PDF belum termuat.", "error");
            }
        };

        function getViewSettings() {
            if(userRole !== 'admin') return `<div class="p-8 text-center text-red-500 font-bold">Akses Ditolak.</div>`;
            return `
                <div class="space-y-6 max-w-2xl mx-auto">
                    <div>
                        <h2 class="text-2xl font-black text-slate-800 flex items-center gap-2"><i data-lucide="settings" class="w-6 h-6 text-blue-600"></i> Pengaturan Sistem</h2>
                        <p class="text-sm text-slate-500 mt-1 font-medium">Konfigurasi database cloud dan keamanan akun.</p>
                    </div>

                    <div class="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200">
                        <h3 class="font-black text-slate-800 mb-6 flex items-center gap-2 border-b border-slate-100 pb-3"><i data-lucide="database" class="w-5 h-5 text-emerald-600"></i> Koneksi Database Google Sheets</h3>
                        <div class="mb-8 space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">URL Web App (Apps Script)</label>
                                ${DATABASE_URL ? 
                                    `<div class="w-full px-4 py-3 border border-emerald-300 bg-emerald-50 rounded-2xl font-bold text-xs text-emerald-800 break-all flex items-start gap-2">
                                        <i data-lucide="check-circle" class="w-4 h-4 text-emerald-600 flex-shrink-0 mt-0.5"></i>
                                        <span>URL Database permanen telah tertanam aktif di dalam aplikasi.</span>
                                     </div>` :
                                    `<input type="text" id="set-url" value="${localStorage.getItem('bayarque_script_url') || ''}" placeholder="https://script.google.com/macros/s/..." class="w-full px-4 py-2.5 border border-slate-200 rounded-xl outline-none focus:border-emerald-500 bg-slate-50 focus:bg-white font-medium text-xs text-slate-800">`
                                }
                            </div>
                        </div>
                    
                        <h3 class="font-black text-slate-800 mb-6 flex items-center gap-2 border-b border-slate-100 pb-3"><i data-lucide="shield" class="w-5 h-5 text-blue-600"></i> Keamanan Akun Administrator</h3>
                        <form onsubmit="saveSettings(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">Password Baru Admin</label>
                                <input type="text" id="set-pass" required value="${state.admin.pass}" placeholder="Masukkan password admin baru..." class="w-full px-4 py-2.5 border border-slate-200 rounded-xl outline-none focus:border-blue-500 bg-slate-50 focus:bg-white font-black text-sm text-slate-900 transition-colors">
                            </div>
                            <div class="pt-3 border-t border-slate-100">
                                <button type="submit" class="w-full px-5 py-3 text-xs font-black text-white bg-blue-600 rounded-xl hover:bg-blue-700 shadow-md flex items-center justify-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> Simpan Pengaturan</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        window.saveSettings = async function(e) {
            e.preventDefault();
            
            let url = DATABASE_URL;
            let prevUrl = localStorage.getItem('bayarque_script_url');
            
            if (!DATABASE_URL) {
                const elUrl = document.getElementById('set-url');
                if (elUrl) {
                    url = elUrl.value.trim();
                    localStorage.setItem('bayarque_script_url', url);
                }
            }
            
            state.admin.pass = document.getElementById('set-pass').value.trim();
            saveCacheToLocalStorage();
            showToast("Berhasil Disimpan", "Password admin berhasil diperbarui.", "success");
            
            if(url && url !== prevUrl) {
                window.location.reload();
            } else {
                await syncToDatabase("Menyimpan Pengaturan...");
            }
        };
    </script>
</body>
</html>
